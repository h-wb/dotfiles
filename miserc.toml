# Early init: decides which config files load.

env_conf_d = true

auto_env = true

# The machine's environment is declared, never detected: its caller names it
# (install.sh from DOTFILES_ENV, scripts/pod-bootstrap from its argument, the
# Paseo pods with `mise -E …`) and `mise bootstrap --save-env` writes
# miserc.local.toml. It names one set below and may add layers after it
# (`env = ["paseo", "paseo-overlay"]`).
# Nothing declared: only config.toml and the shared folders load, and the
# doctor's `wiring` check fails. Needs mise >= 2026.11.1, like min_version.
[env_sets]
personal = ["workstation", "personal"]
neko = ["workstation", "pod", "fish", "neko"]
cachyos = ["workstation", "fish", "cachyos"]
paseo = ["nonroot", "paseo"]
code-server = ["workstation", "pod", "nonroot", "fish", "code-server"]
