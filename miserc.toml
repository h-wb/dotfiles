# Early-init settings: they decide which config files load, so they cannot
# live in config.toml (read too late).

# A single-file conf.d/<name>.<env>.toml loads only for <env> (default from 2027.8.10).
env_conf_d = true

# *.macos.toml / *.linux.toml load by OS (default from 2027.6.0).
auto_env = true

# The machine class. miserc templates cannot read files or exec, only test
# paths. Unrecognised machine: env = ["..."] in an untracked miserc.local.toml.
env = ["{% if '/etc/neko' is exists %}neko{% elif '/etc/pacman.d/cachyos-mirrorlist' is exists %}cachyos{% elif '/etc/paseo' is exists %}paseo{% elif os() == 'macos' %}personal{% endif %}"]
