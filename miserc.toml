# Early init: decides which config files load.

env_conf_d = true

auto_env = true

# Layers, then the class (later wins). Templates can only test paths; an empty
# entry is ignored. CI / unknown machines: env = [...] in miserc.local.toml.
env = [
  "{% if '/etc/paseo' is not exists %}workstation{% endif %}",
  "{% if '/etc/neko' is exists %}neko{% elif '/etc/pacman.d/cachyos-mirrorlist' is exists %}cachyos{% elif '/etc/paseo' is exists %}paseo{% elif os() == 'macos' %}personal{% endif %}",
  "{% if '/etc/paseo/config/paseo.json' is exists %}paseo-overlay{% endif %}",
]
