# Early-init mise settings, shared by every machine. ~/.config/mise is this
# repo, so mise reads this file as its global miserc.toml.
#
# These drive config DISCOVERY — which files load at all — so they can only be
# set here or in the environment; mise.toml/config.toml is read too late.

# A single-file conf.d/<name>.<env>.toml loads only for <env> (default from
# 2027.8.10). Every fragment here is a folder, which is env-aware regardless;
# this just keeps a future single-file one from loading everywhere.
env_conf_d = true

# Platform environments: config.macos.toml, conf.d/*/mise.linux.toml and their
# lockfiles (mise.macos.lock, ...) load automatically by OS (default from
# 2027.6.0). This is what replaced `os = "macos"` on every brew entry.
auto_env = true

# The machine class. miserc can only see the OS (no read_file, no exec), but
# path tests work: /etc/neko is baked into the neko image, the cachyos
# mirrorlist ships with CachyOS, and any Mac is the MacBook for now. An
# unrecognised machine gets no class (shared + platform config only — the
# doctor `wiring` check flags it); pin one in an untracked miserc.local.toml,
# which overrides this: env = ["personal"].
env = ["{% if '/etc/neko' is exists %}neko{% elif '/etc/pacman.d/cachyos-mirrorlist' is exists %}cachyos{% elif os() == 'macos' %}personal{% endif %}"]
