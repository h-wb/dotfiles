# Every machine. ~/.config/mise is a symlink to this repo (first [dotfiles]
# entry), so mise reads these files under their native names. What loads when:
# see the table in CLAUDE.md.

# neko-bootstrap reads this line with sed: keep its shape.
min_version = { hard = "2026.10.19" }

[settings]
self_update.auto = true
self_update.check_duration = "7d"

# Templates read {{ vars.x }}, never a source. Each var defaults to the process
# env (where `fnox exec` puts secrets); config.local.toml can pin a literal.
# [vars] and not [env], because mise's [env] does not feed get_env().
[vars]
repo             = "{{ mise_config_dir }}"
git_email        = "{{ get_env(name='GIT_EMAIL', default='') }}"
ssh_truenas_host = "{{ get_env(name='SSH_TRUENAS_HOST', default='') }}"
ssh_truenas_user = "{{ get_env(name='SSH_TRUENAS_USER', default='') }}"
kubeconfig_main  = "{{ get_env(name='KUBECONFIG_MAIN', default='') }}"
kubeconfig_edge  = "{{ get_env(name='KUBECONFIG_EDGE', default='') }}"

[tools]
node = "lts"
python = "3.14"
"aqua:kubernetes/kubectl" = "latest"
aws-cli = "latest"
"github:bitwarden/sdk-sm" = "latest"
k9s = "latest"
claude = "latest"
"github:cli/cli" = "latest"
"github:shoenot/diskard" = "latest"       # TUI disk usage analyzer
"github:protonpass/pass-cli" = "latest"
"github:jdx/fnox" = "latest"
usage = "latest"
"npm:@metabase/cli" = "latest"
codex = "latest"

# Mistral Vibe CLI (`vibe`). Each release also ships a vibe-acp-* build that
# mise's asset autodetection prefers, so every platform names its zip.
[tools."github:mistralai/mistral-vibe"]
version = "latest"

[tools."github:mistralai/mistral-vibe".platforms]
macos-arm64 = { asset_pattern = "vibe-darwin-aarch64-*.zip" }
macos-x64   = { asset_pattern = "vibe-darwin-x86_64-*.zip" }
linux-arm64 = { asset_pattern = "vibe-linux-aarch64-*.zip" }
linux-x64   = { asset_pattern = "vibe-linux-x86_64-*.zip" }
windows-x64 = { asset_pattern = "vibe-windows-x86_64-*.zip" }

[env]
EDITOR = "code --wait"
PASS_LOG_LEVEL = "error"
# mise installs and upgrades claude; its own updater would npm-install a second
# copy into the active node that shadows it.
DISABLE_AUTOUPDATER = "1"
# No ~/.kube/config in the list: a stale hand-written one could win a context-name collision.
KUBECONFIG = "{{ env.HOME }}/.kube/main.yaml:{{ env.HOME }}/.kube/edge.yaml"

[shell_alias]
repo = "cd {{ env.HOME }}/Repositories"
dotfiles = "code {{ env.HOME }}/.dotfiles"
ops = "code {{ env.HOME }}/Repositories/home-ops"
g = "git"
galias = "git config --get-regexp alias"
df = "mise -C {{ env.HOME }}/.dotfiles"
dfa = "mise run apply"

# ── Dotfiles (sources in home/) ─────────────────────────────────────────────
[dotfiles]
# Absolute source: a relative one would resolve through the link itself.
"~/.config/mise"       = { source = "~/.dotfiles", mode = "symlink" }
"~/.config/git/config" = { source = "home/git/config.tmpl", mode = "template" }
"~/.ssh/config"        = { source = "home/ssh/config.tmpl", mode = "template", permissions = "0600" }
"~/.kube/main.yaml"    = { source = "home/kube/main.yaml.tmpl", mode = "template", permissions = "0600" }
"~/.kube/edge.yaml"    = { source = "home/kube/edge.yaml.tmpl", mode = "template", permissions = "0600" }
# Permissions-only: fixes the mode if the path exists, never creates it.
"~/.ssh"  = { permissions = "0700" }
"~/.kube" = { permissions = "0700" }

# ── Tasks ───────────────────────────────────────────────────────────────────
# Never bootstrap without a live Proton Pass session: fnox's default
# `--if-missing warn` would render the secret-gated files EMPTY over the good
# copies. The preflight is inline (not `depends`) so `pass-cli login` gets the
# terminal. --force-dotfiles: Linux distros write their own config.fish first.
[tasks.apply]
description = "Provision this machine (packages, dotfiles, tools, settings) with secrets"
usage = '''
flag "--dry-run" help="Only show what would change"
flag "--upgrade" help="Update mise, then upgrade packages and tools as well"
'''
dir = "{{ vars.repo }}"
run = """
{% if usage.upgrade %}mise self-update --yes || echo "[warn] mise self-update failed; continuing"{% endif %}
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap {% if usage.dry_run %}--dry-run{% else %}--yes{% endif %}{% if usage.upgrade %} --upgrade{% endif %}{% if os() == "linux" %} --force-dotfiles{% endif %}
"""

[tasks.diff]
description = "Preview what apply would change"
run = "mise run apply --dry-run"

# `latest` tools move: commit the lockfile changes afterwards.
[tasks.upgrade]
description = "Update mise, then apply with packages and tools upgraded"
run = "mise run apply --upgrade"

# ── Doctor checks (`mise doctor project`) ───────────────────────────────────
# Each is an invariant this repo has broken before. Fields are templated, so a
# literal `{{` needs {% raw %}.
[doctor.checks.wiring]
description = "~/.config/mise is this repo and a machine class is selected"
hint = "MISE_CONFIG_DIR=~/.dotfiles mise bootstrap --only dotfiles; unknown machine: env = [...] in ~/.dotfiles/miserc.local.toml"
run = '''
[ -L "$HOME/.config/mise" ] && git -C "$HOME/.config/mise" rev-parse --git-dir >/dev/null 2>&1 \
	|| { echo "~/.config/mise is not a symlink to the dotfiles checkout"; exit 1; }
mise config 2>/dev/null | grep -qE '(config|mise)\.(personal|neko|cachyos|paseo)\.toml' \
	|| { echo "no machine class active — miserc.toml did not recognise this machine"; exit 1; }
'''

[doctor.checks.file-modes]
description = "only real scripts are committed executable"
hint = "git update-index --chmod=-x <file> — a template takes its source's mode"
depends = ["wiring"]
run = '''
cd "{{ vars.repo }}" || exit 1
bad="$(git ls-files -s | awk '$1 != "100644"' | grep -vE '	(install\.sh|scripts/|conf\.d/[^/]+/bin/)' || true)"
[ -z "$bad" ] || { echo "unexpectedly executable:"; echo "$bad"; exit 1; }
'''

# Headers are `[tools.x."platforms.<os-arch>"]`: match `"platforms.`, quote
# included. aws-cli is exempt: AWS publishes no checksums, so only a platform
# that installed it has one.
[doctor.checks.lockfiles]
description = "every locked platform entry carries a checksum"
hint = "run `mise lock --global` (for a pinned http: tool, bump the version + URLs first)"
depends = ["wiring"]
run = '''
cd "{{ vars.repo }}" || exit 1
for f in mise*.lock; do
	awk -v f="$f" '
		/^\[/ { if (sec != "" && !sum) { print f ": " sec; bad = 1 }
		        sec = ($0 ~ /"platforms\./ && $0 !~ /^\[tools\.aws-cli\./) ? $0 : ""; sum = 0; next }
		/^checksum =/ { sum = 1 }
		END { if (sec != "" && !sum) { print f ": " sec; bad = 1 }; exit bad }
	' "$f" || rc=1
done
exit ${rc:-0}
'''

[doctor.checks.credential-perms]
description = "rendered credential dotfiles are not group/world readable"
hint = "re-run `mise bootstrap --only dotfiles`; the entries' `permissions` key repairs them"
run = '''
rc=0
for f in "$HOME/.kube/main.yaml" "$HOME/.kube/edge.yaml" "$HOME/.ssh/config" \
	"$HOME/.config/wireguard/wg0.home.conf"; do
	[ -f "$f" ] || continue
	# Fallback on the assignment: GNU `stat -f` exits 1 but still prints.
	mode="$(stat -c %a "$f" 2>/dev/null)" || mode="$(stat -f %Lp "$f" 2>/dev/null)"
	case "$mode" in 600 | 400) ;; *) echo "$f is $mode, want 600"; rc=1 ;; esac
done
exit $rc
'''

# mise only warns on an unknown key, so a typo is silently a no-op.
[doctor.checks.config-keys]
description = "committed configs use only keys mise reads, none deprecated"
hint = "mise config explain --file <file>"
depends = ["wiring"]
run = '''
cd "{{ vars.repo }}" || exit 1
rc=0
for f in config.toml config.*.toml conf.d/*/mise.*.toml; do
	case "$f" in *.local.toml) continue ;; esac
	bad="$(mise config explain --file "$f" | grep -E 'not a key mise reads|deprecated:')" || continue
	printf '%s:\n%s\n' "$f" "$bad"; rc=1
done
exit $rc
'''
