# Shared mise config — every machine loads this.
#
# This repo IS mise's config dir: ~/.config/mise is a symlink to ~/.dotfiles
# (the first [dotfiles] entry below), so mise reads these files under their
# native names and every relative path resolves inside the repo. What else
# loads, and when:
#
#   config.macos.toml        auto_env — any Mac (brew, zsh, launchd, ssh agent)
#   config.personal.toml     env personal — the MacBook's own packages
#   conf.d/<feature>/        folder fragments; each mise.<env>.toml inside loads
#                            for its env or platform (macos, linux, neko, ...)
#   config.local.toml        untracked per-machine values (wins over everything)
#
# miserc.toml (committed) turns on env_conf_d + auto_env and detects the
# machine class — personal, neko or cachyos; an untracked miserc.local.toml
# can override it.

# The newest feature this layout leans on is a global miserc.local.toml
# (2026.9.17); folder fragments are 2026.9.14, folder tasks running in their
# folder 2026.9.15. An older binary errors here instead of half-loading.
min_version = { hard = "2026.9.17" }

[settings]
auto_update = true                  # self-update before interactive commands
auto_update_check_duration = "7d"   # ...at most once a week; skipped in CI/non-interactive

# ── Vars: one abstraction over "where did this value come from" ─────────────
# Templates read {{ vars.x }} and never name a source. Each defaults to the
# process environment — which is where `fnox exec` puts the Proton Pass secrets —
# and config.local.toml can override the same names with literals. Neither
# present renders empty, and the templates gate their blocks on that.
#
# mise's own [env] does NOT feed get_env() (that reads the real process env),
# which is why this indirection is [vars] and not [env].
[vars]
repo             = "{{ env.HOME }}/.config/mise"
git_email        = "{{ get_env(name='GIT_EMAIL', default='') }}"
ssh_truenas_host = "{{ get_env(name='SSH_TRUENAS_HOST', default='') }}"
ssh_truenas_user = "{{ get_env(name='SSH_TRUENAS_USER', default='') }}"
kubeconfig_main  = "{{ get_env(name='KUBECONFIG_MAIN', default='') }}"
kubeconfig_edge  = "{{ get_env(name='KUBECONFIG_EDGE', default='') }}"

[tools]
node = "lts"
python = "3.14"
"aqua:kubernetes/kubectl" = "latest"
aws-cli = "latest"
"github:bitwarden/sdk-sm" = "latest"
k9s = "latest"
claude = "latest"
"github:cli/cli" = "latest"
"github:shoenot/diskard" = "latest"       # TUI disk usage analyzer
"github:protonpass/pass-cli" = "latest"   # Proton Pass CLI (ssh-agent + fnox backend)
"github:jdx/fnox" = "latest"              # injects Proton Pass secrets as env vars
usage = "latest"
"npm:@metabase/cli" = "latest"
codex = "latest"

[env]
EDITOR = "code --wait"
MISE_EXPERIMENTAL = 1
PASS_LOG_LEVEL = "error"
# kubectl merges every file in this list, so each cluster stays one file. The
# default ~/.kube/config is deliberately absent: a stale hand-written one could
# otherwise win a context-name collision.
KUBECONFIG = "{{ env.HOME }}/.kube/main.yaml:{{ env.HOME }}/.kube/edge.yaml"

# Set by `mise activate` in zsh and fish alike, so one table replaces the two
# alias files the shells used to keep in sync by hand. Platform-specific ones
# live in config.macos.toml / the linux machine-class folders.
[shell_alias]
repo = "cd {{ env.HOME }}/Repositories"
dotfiles = "code {{ env.HOME }}/.dotfiles"
ops = "code {{ env.HOME }}/Repositories/home-ops"
g = "git"
galias = "git config --get-regexp alias"
df = "mise -C {{ env.HOME }}/.dotfiles"
dfa = "mise run apply"

# ── Dotfiles every machine gets ─────────────────────────────────────────────
# Sources for this file and config.*.toml live in home/; folder fragments keep
# their own next to them. `permissions` states a target's mode outright — git
# only records the executable bit, so a source can never be committed 0600.
[dotfiles]
# mise's own config dir, self-managed. The first run cannot go through a link
# that does not exist yet, so install.sh and neko-bootstrap point mise at the
# checkout with MISE_CONFIG_DIR=~/.dotfiles; from then on this keeps it. The
# source must be the absolute checkout path: relative would resolve through
# the link itself.
"~/.config/mise"       = { source = "~/.dotfiles", mode = "symlink" }
"~/.config/git/config" = { source = "home/git/config.tmpl", mode = "template" }
"~/.ssh/config"        = { source = "home/ssh/config.tmpl", mode = "template", permissions = "0600" }
"~/.kube/main.yaml"    = { source = "home/kube/main.yaml.tmpl", mode = "template", permissions = "0600" }
"~/.kube/edge.yaml"    = { source = "home/kube/edge.yaml.tmpl", mode = "template", permissions = "0600" }
# Permissions-only: fix the mode of a path that exists, never create it (a
# missing target is a warning, so this is safe on a box with no ~/.kube).
"~/.ssh"  = { permissions = "0700" }
"~/.kube" = { permissions = "0700" }

# ── Tasks ───────────────────────────────────────────────────────────────────
# Both refuse to run without secrets. fnox's default is `--if-missing warn`: a
# dead Proton Pass session is a warning, the bootstrap runs with every secret
# unset, and the templates render EMPTY over the good copies (~/.ssh/config
# loses its hosts). pass-preflight gets a session (or fails); `--if-missing
# error` makes anything still unresolved fatal. The preflight is inline rather
# than a `depends` so `pass-cli login` gets this terminal's stdin.
#
# --force-dotfiles on Linux only: CachyOS and the neko image write their own
# ~/.config/fish/config.fish before we get there, and mise will not replace a
# regular file with a symlink without it.
[tasks.apply]
description = "Provision this machine (packages, dotfiles, tools, settings) with secrets"
dir = "{{ vars.repo }}"
run = """
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --yes {% if os() == "linux" %}--force-dotfiles{% endif %}
"""

[tasks.diff]
description = "Preview what apply would change"
dir = "{{ vars.repo }}"
run = """
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --dry-run
"""

# ── Doctor checks ───────────────────────────────────────────────────────────
# `mise doctor project`. Each is an invariant this repo has broken before.
# Fields are description/run/hint only, and `run` is NOT templated (a task's
# is) — a check that needs [vars] delegates to a task.
[doctor.checks.wiring]
description = "~/.config/mise is this repo and a machine class is selected"
hint = "MISE_CONFIG_DIR=~/.dotfiles mise bootstrap --only dotfiles; unknown machine: env = [...] in ~/.dotfiles/miserc.local.toml"
run = '''
[ -L "$HOME/.config/mise" ] && git -C "$HOME/.config/mise" rev-parse --git-dir >/dev/null 2>&1 \
	|| { echo "~/.config/mise is not a symlink to the dotfiles checkout"; exit 1; }
mise config 2>/dev/null | grep -qE '(config|mise)\.(personal|neko|cachyos)\.toml' \
	|| { echo "no machine class active — miserc.toml did not recognise this machine"; exit 1; }
'''

[doctor.checks.file-modes]
description = "only real scripts are committed executable"
hint = "git update-index --chmod=-x <file> — a template takes its source's mode"
run = '''
cd "$HOME/.config/mise" || exit 0
bad="$(git ls-files -s | awk '$1 != "100644"' | grep -vE '	(install\.sh|scripts/|conf\.d/[^/]+/bin/)' || true)"
[ -z "$bad" ] || { echo "unexpectedly executable:"; echo "$bad"; exit 1; }
'''

# Section headers are `[tools.<name>."platforms.<os-arch>"]` — the match is on
# `"platforms.`, quote included. (The check this replaced looked for
# `.platforms.`, matched nothing, and passed vacuously for weeks.)
#
# aws-cli is exempt: AWS publishes no checksums and `mise lock` does not
# download, so only a platform that has actually installed it gets one (the
# Macs). Any other missing checksum fails.
[doctor.checks.lockfiles]
description = "every locked platform entry carries a checksum"
hint = "run `mise lock --global` (for a pinned http: tool, bump the version + URLs first)"
run = '''
cd "$HOME/.config/mise" || exit 0
for f in mise*.lock; do
	awk -v f="$f" '
		/^\[/ { if (sec != "" && !sum) { print f ": " sec; bad = 1 }
		        sec = ($0 ~ /"platforms\./ && $0 !~ /^\[tools\.aws-cli\./) ? $0 : ""; sum = 0; next }
		/^checksum =/ { sum = 1 }
		END { if (sec != "" && !sum) { print f ": " sec; bad = 1 }; exit bad }
	' "$f" || rc=1
done
exit ${rc:-0}
'''

[doctor.checks.credential-perms]
description = "rendered credential dotfiles are not group/world readable"
hint = "re-run `mise bootstrap --only dotfiles`; the entries' `permissions` key repairs them"
run = '''
rc=0
for f in "$HOME/.kube/main.yaml" "$HOME/.kube/edge.yaml" "$HOME/.ssh/config" \
	"$HOME/.config/wireguard/wg0.home.conf"; do
	[ -f "$f" ] || continue
	# The fallback is on the ASSIGNMENT: GNU `stat -f` exits 1 but still prints.
	mode="$(stat -c %a "$f" 2>/dev/null)" || mode="$(stat -f %Lp "$f" 2>/dev/null)"
	case "$mode" in 600 | 400) ;; *) echo "$f is $mode, want 600"; rc=1 ;; esac
done
exit $rc
'''
