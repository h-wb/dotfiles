name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A throwaway HOME set up the way install.sh sets up a machine, with the class
# pinned (a runner's OS is not the machine's). No secrets: templates render
# their empty fallbacks, which is what validates them.

jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mise: ["2026.10.19", "latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # The action spells a version into the download URL (`vlatest` is a
          # 404); empty means its own default, the newest release.
          version: ${{ matrix.mise != 'latest' && matrix.mise || '' }}
          install: false
      - run: python3 tests/test_setup.py -v

  machine:
    strategy:
      fail-fast: false
      matrix:
        include:
          # layers: what miserc.toml would pick on that machine (it can't see a runner's)
          - { env: personal, layers: '"workstation", "personal"', os: macos-latest }
          - { env: neko, layers: '"workstation", "pod", "neko"', os: ubuntu-latest }
          - { env: cachyos, layers: '"workstation", "cachyos"', os: ubuntu-latest }
          - { env: paseo, layers: '"pod", "paseo"', os: ubuntu-latest }
    name: ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false

      - name: Throwaway HOME with the checkout at ~/.dotfiles
        run: |
          home="$(mktemp -d)"
          ln -s "$GITHUB_WORKSPACE" "$home/.dotfiles"
          printf 'env = [%s]\n' '${{ matrix.layers }}' > miserc.local.toml
          echo "HOME=$home" >> "$GITHUB_ENV"
          echo "MISE_CONFIG_DIR=$home/.dotfiles" >> "$GITHUB_ENV"

      - name: Config loads for this machine class
        run: |
          mise config | tee /tmp/cfg
          mise tasks validate --errors-only
          # every task must template (a bad {{ }}, even in a comment, fails here)
          for t in $(mise tasks --hidden --no-header | awk '{print $1}'); do mise tasks info "$t" >/dev/null; done
          case "${{ matrix.env }}" in
          personal)
            for f in config.macos.toml config.personal.toml conf.d/zsh/mise.macos.toml \
                     conf.d/macos-defaults/mise.macos.toml conf.d/k8s-dns/mise.personal.toml; do
              grep -q "$f" /tmp/cfg || { echo "::error::$f not loaded"; exit 1; }
            done ;;
          neko)    grep -q conf.d/neko/mise.neko.toml /tmp/cfg && grep -q conf.d/anki/mise.neko.toml /tmp/cfg ;;
          cachyos) grep -q conf.d/cachyos/mise.cachyos.toml /tmp/cfg ;;
          paseo)   grep -q conf.d/paseo/mise.paseo.toml /tmp/cfg ;;
          esac
          # the layers: workstation everywhere but paseo, pod on the two pods
          case "${{ matrix.env }}" in
          paseo) ! grep -q config.workstation.toml /tmp/cfg || { echo "::error::workstation leaked into paseo"; exit 1; } ;;
          *)     grep -q config.workstation.toml /tmp/cfg || { echo "::error::workstation layer not loaded"; exit 1; } ;;
          esac
          case "${{ matrix.env }}" in
          neko | paseo) grep -q conf.d/pod/mise.pod.toml /tmp/cfg || { echo "::error::pod layer not loaded"; exit 1; } ;;
          *)            ! grep -q conf.d/pod/mise.pod.toml /tmp/cfg || { echo "::error::pod layer leaked"; exit 1; } ;;
          esac
          # nothing from another machine class or platform leaks in
          for other in personal neko cachyos paseo; do
            [ "$other" = "${{ matrix.env }}" ] && continue
            ! grep -qE "(config|mise)\.$other\.toml" /tmp/cfg || { echo "::error::$other config leaked"; exit 1; }
          done
          if [ "$RUNNER_OS" = Linux ]; then ! grep -q 'macos.toml' /tmp/cfg; fi

      - name: Dotfiles render
        run: |
          mise bootstrap dotfiles apply --yes
          test "$(readlink "$HOME/.config/mise")" = "$HOME/.dotfiles"   # the self-managed link
          grep -qx 'HashKnownHosts no' "$HOME/.ssh/config"         # rendered, secret block skipped
          test "$(grep -c '^Host TN1' "$HOME/.ssh/config")" = 0
          case "${{ matrix.env }}" in
          personal)
            test -L "$HOME/.zshrc" && test -L "$HOME/.config/zsh"
            test -f "$HOME/.config/wireguard/wg0.home.conf" ;;
          neko)
            test -L "$HOME/.config/fish/config.fish"
            test -x "$HOME/.local/bin/neko-bootstrap"
            test -x "$HOME/.local/bin/anki-session"
            test -x "$HOME/.local/bin/obsidian-session"
            grep -q "^Exec=$HOME/.local/bin/obsidian-session" "$HOME/.local/share/applications/obsidian.desktop"
            for app in code zen; do
              grep -q "^Exec=$HOME/.local/share/mise/shims/$app" "$HOME/.local/share/applications/$app.desktop"
            done ;;
          cachyos)
            readlink "$HOME/.config/fish/config.fish" | grep -q conf.d/cachyos/fish/
            test -L "$HOME/.config/systemd/user/gamescope-session.service.d/projector.conf"
            grep -q "^Exec=$HOME/.local/share/mise/shims/ludo" "$HOME/.local/share/applications/ludo.desktop" ;;
          paseo)
            test -x "$HOME/.local/bin/paseo-bootstrap"
            test -L "$HOME/.config/opencode/opencode.json"
            test ! -e "$HOME/.kube/main.yaml"   # no kubeconfigs: kubectl uses the pod's service account
            test -z "$(mise env --shell bash | grep '^export KUBECONFIG=')" ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            for f in .zshrc .config/zsh .config/wireguard Library; do
              test ! -e "$HOME/$f" || { echo "::error::$f leaked onto linux"; exit 1; }
            done
          fi

      - name: Same templates, values from the environment (the config.local.toml/BWS path)
        run: |
          SSH_TRUENAS_HOST=tn.example SSH_TRUENAS_USER=someone mise bootstrap dotfiles apply --yes
          grep -q 'HostName tn.example' "$HOME/.ssh/config"
          grep -q 'User someone' "$HOME/.ssh/config"

      # Retarget the privileged files to scratch paths first: the runner has
      # passwordless sudo, so as-is this would write its real /etc/resolver.
      - name: k8s-dns resolver template
        if: matrix.env == 'personal'
        run: |
          tmp="$(mktemp -d)"; out="$tmp/resolver"
          f=conf.d/k8s-dns/mise.personal.toml
          sed -i.bak -e "s#/etc/resolver/wlab.ovh#$out#" -e '/^owner = "root"$/d' -e '/^group = "wheel"$/d' "$f"
          sed -i.bak -e "s#/Library/LaunchDaemons/#$tmp/#" -e '/^owner = "root"$/d' -e '/^group = "wheel"$/d' conf.d/local-llm/mise.personal.toml
          ! grep -q /etc/resolver/ "$f"   # the retarget took
          export K8S_GATEWAY_IP_MAIN=10.1.1.1 K8S_GATEWAY_IP_EDGE=10.9.9.9
          k8s_dns_cluster=main mise bootstrap files apply --yes; test "$(cat "$out")" = "nameserver 10.1.1.1"
          k8s_dns_cluster=edge mise bootstrap files apply --yes; test "$(cat "$out")" = "nameserver 10.9.9.9"
          # the per-machine answer dns:use saves
          mise vars k8s_dns_cluster=edge; mise bootstrap files apply --yes; test "$(cat "$out")" = "nameserver 10.9.9.9"
          mise vars unset k8s_dns_cluster
          k8s_dns_cluster=typo mise bootstrap files apply --yes; test "$(cat "$out")" = "nameserver 10.1.1.1"
          test "$(wc -l <"$out")" -eq 1
          # a missing secret must fail and leave the previous file alone
          ! k8s_dns_cluster=edge K8S_GATEWAY_IP_EDGE= mise bootstrap files apply --yes
          test "$(cat "$out")" = "nameserver 10.1.1.1"
          mv "$f.bak" "$f"; mv conf.d/local-llm/mise.personal.toml.bak conf.d/local-llm/mise.personal.toml

      # Only the repo-state doctor checks can pass on a runner.
      - name: Repo invariants
        run: |
          # Locked PyPI graphs need their interpreter even for an install preview.
          mise install --locked python uv
          mise doctor project 2>&1 | tee /tmp/doctor || true
          for check in config-keys file-modes lockfiles wiring tasks; do
            grep -q "^PASS $check" /tmp/doctor || { echo "::error::doctor check '$check' failed"; exit 1; }
          done
