name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: macos-latest
    # personal is what a real Mac runs, and it is where the secret-gated dotfiles
    # (ssh, wireguard) live — without it this job renders neither.
    env:
      MISE_ENV: personal
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Render all templated dotfiles into a throwaway HOME. With no fnox/secrets
      # in the environment, the secret-gated blocks (ssh/wireguard) are skipped —
      # this validates the Tera templates and the config parse.
      - name: Render dotfiles
        run: |
          export HOME="$(mktemp -d)"
          mise trust
          mise bootstrap dotfiles apply --yes
          echo "--- ~/.config/git/config ---"; cat "$HOME/.config/git/config"
          echo "--- ~/.ssh/config ---"; cat "$HOME/.ssh/config"

          # The macOS half of the `variants` migration. These four used to be
          # unconditional (so they also landed in the container) and these two
          # used to live in mise.personal.toml purely because [dotfiles] had no
          # `os` filter. They must all still arrive on a Mac.
          test -L "$HOME/.config/zsh"
          test -L "$HOME/.zshrc"
          test -L "$HOME/.zshenv"
          test -L "$HOME/.p10k.zsh"
          test -L "$HOME/Library/Application Support/BetterTouchTool/Default.bttpreset"
          # secret-gated, so with no secrets in CI it renders empty — but the
          # variant must still have selected it, so the file has to exist
          test -f "$HOME/.config/wireguard/wg0.home.conf"

  # The neko/xfce container config. Linux runner, `neko` env active: this catches
  # the things the macOS job cannot — a Linux-only [dotfiles] entry that fails to
  # render, an overlay that stops parsing, a task that disappears.
  render-neko:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: neko
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Render dotfiles (neko env)
        run: |
          export HOME="$(mktemp -d)"
          mise trust
          mise bootstrap dotfiles apply --yes
          echo "--- ~/.config/autostart/mise-bootstrap.desktop ---"
          cat "$HOME/.config/autostart/mise-bootstrap.desktop"
          test -L "$HOME/.config/fish/config.fish"
          test -L "$HOME/.config/fish/conf.d/aliases.fish"
          test -L "$HOME/.config/xfce4/terminal/terminalrc"
          test -x "$HOME/.local/bin/neko-bootstrap"
          # menu entries are dotfiles now, and their Exec must resolve to a mise
          # shim (stable across version bumps) rather than a versioned path
          for app in code obsidian zen; do
            grep -q "^Exec=$HOME/.local/share/mise/shims/$app" \
              "$HOME/.local/share/applications/$app.desktop"
          done
          test -L "$HOME/.config/mimeapps.list"
          # the ssh template renders from vars: empty with no source...
          grep -qx 'HashKnownHosts no' "$HOME/.ssh/config"
          test "$(grep -c 'Host TN1' "$HOME/.ssh/config")" = 0
          # ...and the Linux half of the `variants` migration: the mac-only
          # entries must NOT land here. Before variants the zsh files did.
          for f in .config/zsh .zshrc .zshenv .p10k.zsh \
                   .config/wireguard/wg0.home.conf "Library"; do
            test ! -e "$HOME/$f" || { echo "::error::$f leaked onto linux"; exit 1; }
          done

      # The same template, fed from the environment instead of fnox: this is the
      # container's path, and it must produce the same file the Macs get.
      - name: Templated dotfiles render from vars (env source)
        run: |
          export HOME="$(mktemp -d)"
          SSH_TRUENAS_HOST=tn.example SSH_TRUENAS_USER=someone \
            mise bootstrap dotfiles apply --yes
          grep -q 'HostName tn.example' "$HOME/.ssh/config"
          grep -q 'User someone' "$HOME/.ssh/config"

      # The neko:* tasks live in conf.d fragments, which only load through the
      # global config dir — so this also exercises the install.sh wiring
      # (conf.d symlink + miserc selecting the env).
      # MISE_CONFIG_DIR, not HOME: mise-action pins mise's config dir for the job,
      # so moving HOME here does not move where conf.d is looked up (that is how
      # this step first failed — fragments silently absent from `mise config`).
      - name: conf.d fragments load and their tasks resolve
        run: |
          export MISE_CONFIG_DIR="$(mktemp -d)/mise"
          mkdir -p "$MISE_CONFIG_DIR"
          ln -sfn "$PWD/conf.d" "$MISE_CONFIG_DIR/conf.d"
          printf 'env = ["neko"]\nenv_conf_d = true\n' > "$MISE_CONFIG_DIR/miserc.toml"
          mise trust
          mise config | tee /tmp/cfg
          grep -q 'conf.d/xfce.neko.toml' /tmp/cfg
          mise tasks --all | grep -q 'neko:xfce'

      # Lockfiles are written per config FILE, but every conf.d fragment shares one
      # at ~/.config/mise/mise.lock — outside the repo. That is why the GUI apps
      # live in mise.neko.toml and not a fragment: it is the only way their pinned
      # vendor URLs get a checksum that is committed. Guard both halves.
      - name: Lockfiles cover the pinned tools
        run: |
          test -f mise.lock && test -f mise.neko.lock
          for tool in http:vscode http:obsidian github:zen-browser/desktop; do
            grep -q "\[\[tools.\"$tool\"\]\]" mise.neko.lock \
              || { echo "::error::$tool missing from mise.neko.lock"; exit 1; }
          done
          # every platform entry in either lockfile must carry a checksum, or the
          # lockfile is decorative — this is what catches a bumped `http:` version
          # whose author forgot to re-run `mise lock`
          python3 - <<'EOF'
          import re, sys
          bad = []
          for path in ("mise.lock", "mise.neko.lock"):
              section, has_sum = None, False
              for line in open(path).read().splitlines() + ["[end]"]:
                  if line.startswith("["):
                      if section and not has_sum:
                          bad.append(f"{path}: {section}")
                      section = line if ".platforms." in line else None
                      has_sum = False
                  elif line.startswith("checksum ="):
                      has_sum = True
          if bad:
              print("::error::platform entries with no checksum:")
              print("\n".join(bad)); sys.exit(1)
          print("all platform entries carry a checksum")
          EOF
