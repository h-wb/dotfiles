# Full-mise dotfiles config — the single source of truth (chezmoi removed).
#
#   mise run apply     -> fnox exec -c fnox.toml -- mise bootstrap   (installs everything)
#   mise run diff      -> preview without changing anything
#
# install.sh symlinks this file to ~/.config/mise/config.toml (and conf.d/ →
# ~/.config/mise/conf.d) so mise uses it globally for tools/env; [dotfiles]/
# [bootstrap] only act during `mise bootstrap`. Verbose/global bits are split into
# conf.d/ (macos-defaults.toml, settings.toml, zen-history.personal.toml). Profile packages: mise.personal.toml.

# git_email is personal, so it is NOT committed — it lives in an untracked
# mise.local.toml ([vars] git_email = "..."); see mise.local.toml.example. The
# git config template falls back to empty if it's missing.
# Secret-gated dotfiles (ssh/wireguard) key off whether fnox provided the secret
# env var, so no secrets/profile flag is needed.

# ── Vars: the one abstraction over "where did this value come from" ─────────
# Templated dotfiles read {{ vars.x }} and never name a source. Each var
# defaults to whatever is in the ENVIRONMENT — that is the macOS path, where
# `fnox exec` injects the ProtonPass secrets before bootstrap runs. A machine
# without fnox, or one that simply prefers a literal, overrides the same names in
# an untracked mise.local.toml, which wins over this file. Neither source present
# renders empty, and the templates gate their blocks on that.
#
# NOTE: mise's own [env] does NOT feed get_env() — it reads the real process
# environment — which is exactly why this indirection is [vars] and not [env].
[vars]
git_email        = "{{ get_env(name='GIT_EMAIL', default='') }}"
ssh_truenas_host = "{{ get_env(name='SSH_TRUENAS_HOST', default='') }}"
ssh_truenas_user = "{{ get_env(name='SSH_TRUENAS_USER', default='') }}"
wg0_home_conf    = "{{ get_env(name='WG0_HOME_CONF', default='') }}"
kubeconfig_main  = "{{ get_env(name='KUBECONFIG_MAIN', default='') }}"
kubeconfig_edge  = "{{ get_env(name='KUBECONFIG_EDGE', default='') }}"

[tools]
# languages
node = "lts"
python = "3.14"

# cli tools
"aqua:kubernetes/kubectl" = "latest"
aws-cli = "latest"
"github:bitwarden/sdk-sm" = "latest"
k9s = "latest"
claude = "latest"

# github releases
"github:cli/cli" = "latest"
"github:shoenot/diskard" = "latest"     # TUI disk usage analyzer (reclaim space)
"github:nikolaeu/numi" = { version = "latest", os = "macos" }
"github:protonpass/pass-cli" = "latest"   # Proton Pass CLI (ssh-agent + fnox backend)
"github:jdx/fnox" = "latest"              # injects ProtonPass secrets as env vars
usage = "latest"

[env]
EDITOR = "code --wait"
MISE_EXPERIMENTAL = 1
PASS_LOG_LEVEL = "error"
SSH_AUTH_SOCK = "{{env.HOME}}/.ssh/proton-pass-agent.sock"
# kubectl merges every file in this list, so the clusters stay one file each
# instead of something having to merge YAML. ~/.kube/config is deliberately NOT
# here: these two are the managed copies, and leaving the default path out means
# a stale hand-written config cannot silently win a context-name collision.
KUBECONFIG = "{{env.HOME}}/.kube/main.yaml:{{env.HOME}}/.kube/edge.yaml"

# ── Dotfiles ────────────────────────────────────────────────────────────────
# template mode renders Tera ({{ vars.x }}, {{ env.x }}, {% if %}); symlink mode
# links the source. The mise config itself is symlinked by install.sh, not here.
# Entries here read [vars], so they work on both machine classes: fnox supplies
# the values on macOS, mise.local.toml on the container.
#
# `variants` (mise 2026.9.5) is what lets this be the ONE dotfiles list. Entries
# used to have no `os` filter, so anything mac-only had to be exiled to
# mise.personal.toml and the zsh files landed in the container as harmless
# clutter. A variant list carries the target path per selector — and, verified on
# 2026.9.9, an entry whose selectors ALL fail and which has no `default = true`
# applies nothing at all. That is the filter. Selectors are `os` (optionally
# os/arch), `profile` (the active MISE_ENV) and `default`; they score
# profile 2 / os 1 / arch 1, highest wins, ties are an error.
#
# Prefer `os` over `profile` for anything that is about the platform rather than
# the machine class, so a future mac env inherits it without being listed.
[dotfiles]
# Both machine classes.
"~/.config/git/config" = { source = "home/git/config.tmpl", mode = "template" }
"~/.ssh/config"        = { source = "home/ssh/config.tmpl", mode = "template" }
"~/.kube/main.yaml"    = { source = "home/kube/main.yaml.tmpl", mode = "template" }
"~/.kube/edge.yaml"    = { source = "home/kube/edge.yaml.tmpl", mode = "template" }

# macOS only — zsh + z4h + p10k are the Macs' shell; the container is fish +
# starship (mise.neko.toml). Before variants these applied everywhere.
"zsh-config-dir" = { source = "home/zsh", mode = "symlink", variants = [{ os = "macos", target = "~/.config/zsh" }] }
"zshrc"          = { source = "home/zshrc", mode = "symlink", variants = [{ os = "macos", target = "~/.zshrc" }] }
"zshenv"         = { source = "home/zshenv", mode = "symlink", variants = [{ os = "macos", target = "~/.zshenv" }] }
"p10k"           = { source = "home/p10k.zsh", mode = "symlink", variants = [{ os = "macos", target = "~/.p10k.zsh" }] }

# macOS only, and previously stranded in mise.personal.toml purely because there
# was no `os` filter here. A WireGuard tunnel into the home network is meaningless
# from inside the cluster it would tunnel to, and BetterTouchTool is mac software;
# the value still comes from vars.wg0_home_conf like everything else.
"wg0-home" = { source = "home/wireguard/wg0.home.conf.tmpl", mode = "template", variants = [{ os = "macos", target = "~/.config/wireguard/wg0.home.conf" }] }
"btt-preset" = { source = "home/Library/Application Support/BetterTouchTool/Default.bttpreset", mode = "symlink", variants = [{ os = "macos", target = "~/Library/Application Support/BetterTouchTool/Default.bttpreset" }] }

# ── Bootstrap: system provisioning ──────────────────────────────────────────
# Before packages: Rosetta + Homebrew (which also installs the Command Line
# Tools). Guarded to macOS; idempotent.
[bootstrap.hooks.pre-packages]
run = '''
[ "$(uname)" = "Darwin" ] || exit 0
if [ "$(uname -m)" = "arm64" ] && [ ! -f /Library/Apple/usr/share/rosetta/rosetta ]; then
  softwareupdate --install-rosetta --agree-to-license
fi
if ! command -v brew >/dev/null 2>&1; then
  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
if [ "$(uname -m)" = "arm64" ] && ! grep -q "/opt/homebrew/bin" /etc/paths 2>/dev/null; then
  printf '%s\n' "/opt/homebrew/bin" "$(cat /etc/paths)" | sudo tee /etc/paths >/dev/null
fi
'''

# mise renders dotfiles 0755, which is wrong for anything holding credentials —
# a kubeconfig embeds client certs and tokens. A hook rather than a line in each
# [tasks.bootstrap] because same-named hooks ACCUMULATE across configs, so this
# one runs on the Macs and in the container alike (the tasks do not: neko
# overrides the shared one).
[bootstrap.hooks.post-dotfiles]
run = """
for f in "$HOME/.kube/main.yaml" "$HOME/.kube/edge.yaml" "$HOME/.ssh/config" \
	"$HOME/.config/wireguard/wg0.home.conf"; do
	[ -f "$f" ] && chmod 600 "$f"
done
[ -d "$HOME/.ssh" ] && chmod 700 "$HOME/.ssh"
[ -d "$HOME/.kube" ] && chmod 700 "$HOME/.kube"
true
"""

# Common packages (formulae, casks, mas). mise drives real Homebrew.
# os = "macos" on every entry: this file is the *shared* config, so it is also
# loaded inside the neko/xfce container (see mise.neko.toml), where brew has no
# business running. [tools] takes the same filter (numi above); [dotfiles] does
# NOT — mac-only dotfiles have to be moved into a mac-only overlay instead.
[bootstrap.packages]
# casks
"brew-cask:zen" = { version = "latest", os = "macos" }
"brew-cask:alt-tab" = { version = "latest", os = "macos" }          # windows-style alt-tab switcher
"brew-cask:anki" = { version = "latest", os = "macos" }             # flashcard app
"brew-cask:betterdisplay" = { version = "latest", os = "macos" }    # display management
"brew-cask:ghostty" = { version = "latest", os = "macos" }          # terminal emulator
"brew-cask:obsidian" = { version = "latest", os = "macos" }         # note-taking
"brew-cask:orbstack" = { version = "latest", os = "macos" }         # fast Docker / Linux VMs
"brew-cask:plexamp" = { version = "latest", os = "macos" }          # music player for Plex
"brew-cask:raycast" = { version = "latest", os = "macos" }          # spotlight replacement / launcher
"brew-cask:spotify" = { version = "latest", os = "macos" }
"brew-cask:visual-studio-code" = { version = "latest", os = "macos" }
"brew-cask:utm" = { version = "latest", os = "macos" }
"brew-cask:bettertouchtool" = { version = "latest", os = "macos" }

# ProtonPass ssh-agent. mise rejects Label/EnvironmentVariables/Standard*Path and
# forces the plist name dev.mise.<key>, so env vars + logging are folded into the
# sh -c string.
# NOTE: mise does NOT template launchd args ({{...}} is passed through literally),
# so use shell $HOME here — the program is /bin/sh -c and launchd sets HOME.
[bootstrap.macos.launchd.agents.pass-cli-ssh-agent]
program = "/bin/sh"
args = [
  "-c",
  "exec env PASS_LOG_LEVEL=error \"$(\"$HOME/.local/bin/mise\" which pass-cli)\" ssh-agent start --socket-path \"$HOME/.ssh/proton-pass-agent.sock\" >> \"$HOME/.ssh/proton-pass-agent.log\" 2>&1",
]
run_at_load = true
keep_alive = true

# macOS defaults + their post-defaults hook live in conf.d/macos-defaults.toml
# (verbose and rarely edited — split out to keep this file scannable). The Zen
# history snapshot agent lives in conf.d/zen-history.personal.toml. Global
# mise settings (auto_update) live in conf.d/settings.toml.

# ── Doctor checks ───────────────────────────────────────────────────────────
# `mise doctor project` (2026.9.6) runs these. Each one is an invariant this repo
# has broken at least once, so a check is cheaper than remembering. Fields are
# `description`, `run` and `hint` — mise rejects anything else.
#
# They address $HOME/.dotfiles explicitly rather than the cwd: mise.toml is the
# GLOBAL config here (install.sh symlinks it), so these are in scope from any
# directory, and a check that inspected the current project's git would be
# reporting on the wrong repo.
[doctor.checks.file-modes]
description = "no dotfile source is committed executable"
hint = "git update-index --chmod=-x <file> — a 100755 template renders 0755, which is how ~/.ssh/config ended up world-readable"
run = '''
cd "$HOME/.dotfiles" || exit 0
bad="$(git ls-files -s | awk '$1 != "100644"' | grep -vE '	(install\.sh|scripts/|home/bin/)' || true)"
[ -z "$bad" ] || { echo "unexpectedly executable:"; echo "$bad"; exit 1; }
'''

[doctor.checks.lockfiles]
description = "every locked platform entry carries a checksum"
hint = "run `mise lock` (and for pinned http: tools, bump the version + both URLs first)"
run = '''
cd "$HOME/.dotfiles" || exit 0
python3 - <<'EOF'
import sys, os
bad = []
for path in ("mise.lock", "mise.neko.lock"):
    if not os.path.exists(path):
        bad.append(f"{path}: missing entirely"); continue
    section, has_sum = None, False
    for line in open(path).read().splitlines() + ["[end]"]:
        if line.startswith("["):
            if section and not has_sum:
                bad.append(f"{path}: {section}")
            section = line if ".platforms." in line else None
            has_sum = False
        elif line.startswith("checksum ="):
            has_sum = True
if bad:
    print("\n".join(bad)); sys.exit(1)
EOF
'''

[doctor.checks.credential-perms]
description = "rendered credential dotfiles are not group/world readable"
hint = "re-run `mise bootstrap --only dotfiles`; the post-dotfiles hook chmods them"
run = '''
rc=0
for f in "$HOME/.kube/main.yaml" "$HOME/.kube/edge.yaml" "$HOME/.ssh/config" \
	"$HOME/.config/wireguard/wg0.home.conf"; do
	[ -f "$f" ] || continue
	# GNU stat first, BSD/macOS second. Note the fallback has to be on the
	# ASSIGNMENT, not inside the substitution: GNU `stat -f` exits 1 but still
	# prints filesystem info to stdout, so `a || b` inside $() concatenates both.
	mode="$(stat -c %a "$f" 2>/dev/null)" || mode="$(stat -f %Lp "$f" 2>/dev/null)"
	case "$mode" in
	600 | 400) ;;
	*)
		echo "$f is $mode, want 600"
		rc=1
		;;
	esac
done
exit $rc
'''

[doctor.checks.mise-wiring]
description = "~/.config/mise points at this repo"
hint = "run scripts/link-mise-config — without it conf.d fragments and env overlays never load"
run = '''
target="$(readlink "$HOME/.config/mise/config.toml" || true)"
case "$target" in
*/.dotfiles/mise.toml) ;;
*) echo "~/.config/mise/config.toml -> ${target:-<not a symlink>}"; exit 1 ;;
esac
[ -L "$HOME/.config/mise/conf.d" ] || { echo "~/.config/mise/conf.d is not a symlink"; exit 1; }
[ -f "$HOME/.config/mise/miserc.toml" ] || { echo "no miserc.toml — no env is selected"; exit 1; }
'''

# ── Tasks ───────────────────────────────────────────────────────────────────
# Runs at the end of `mise bootstrap`. Secret env vars come from fnox (bootstrap
# is invoked under `fnox exec`); the resolver step is skipped if they're absent.
[tasks.bootstrap]
run = '''
[ -d "$HOME/.ssh" ] && chmod 700 "$HOME/.ssh" || true
if [ "$(uname)" = "Darwin" ] && [ -n "${K8S_GATEWAY_IP:-}" ] && [ -n "${K8S_GATEWAY_HOST:-}" ]; then
  resolver="/etc/resolver/${K8S_GATEWAY_HOST}"
  want="nameserver ${K8S_GATEWAY_IP}"
  # only sudo when the file is missing or stale, so routine applies don't prompt
  if [ ! -f "$resolver" ] || [ "$(cat "$resolver" 2>/dev/null)" != "$want" ]; then
    sudo mkdir -p /etc/resolver
    printf "%s\n" "$want" | sudo tee "$resolver" >/dev/null
    echo "[info] installed $resolver"
  else
    echo "[info] $resolver already current"
  fi
fi
'''

# dir = the repo, so `mise bootstrap` loads THIS file as the project config and
# resolves [dotfiles] sources relative to the repo (not ~/.config/mise, where the
# global symlink lives). This also lets fnox find fnox.toml by relative path.
#
# Both tasks guard the secrets before touching anything:
#   scripts/pass-preflight  -> live Proton Pass session (offers to log in)
#   fnox --if-missing error -> every secret in fnox.toml actually resolved
# Without the flag fnox only WARNs on an unresolved secret and still runs the
# bootstrap, which re-renders the secret-gated dotfiles empty and clobbers them.
# The preflight is inline rather than a `depends` task so `pass-cli login` gets
# this terminal's stdin.
[tasks.apply]
description = "Install everything (packages, macOS, dotfiles, tools) with secrets via fnox"
dir = "{{env.HOME}}/.dotfiles"
run = """
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --yes
"""

[tasks.diff]
description = "Preview what bootstrap would change"
dir = "{{env.HOME}}/.dotfiles"
run = """
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --dry-run
"""
