# Personal-profile overlay, merged onto mise.toml when MISE_ENV=personal.
# (anki lives in the common list; not duplicated here.)
[bootstrap.packages]
# formulae
"brew:mas" = "latest"                # Mac App Store CLI
# casks
"brew-cask:beeper" = "latest"
"brew-cask:crossover" = "latest"        # run Windows apps on macOS
"brew-cask:nextcloud" = "latest"        # cloud storage client
"brew-cask:plex" = "latest"
"brew-cask:screenmemory" = "latest"     # screen activity recorder
"brew-cask:protonvpn" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:whatsapp" = "latest"
# mac app store
"mas:1451685025" = "latest"          # WireGuard

# macOS-only: [dotfiles] entries take no `os` filter, and this overlay only loads
# on machines running env = ["personal"], so parking it here keeps the neko
# container from growing a stray ~/Library.
[dotfiles]
# Secret-gated: rendered from fnox-injected env vars, and they fall back to empty
# when the secret is absent — so they must NOT be in the shared list, where the
# neko container (which has no fnox) would blank them on every session start.
"~/.config/wireguard/wg0.home.conf" = { source = "home/wireguard/wg0.home.conf.tmpl", mode = "template" }
"~/.ssh/config"                     = { source = "home/ssh/config.tmpl", mode = "template" }
"~/Library/Application Support/BetterTouchTool/Default.bttpreset" = { source = "home/Library/Application Support/BetterTouchTool/Default.bttpreset", mode = "symlink" }
