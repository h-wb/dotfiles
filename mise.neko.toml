# neko/xfce container overlay — merged onto mise.toml when `neko` is an active
# env (~/.config/mise/miserc.toml: env = ["neko"]).
#
# Target: ghcr.io/m1k1o/neko/xfce — Debian trixie, user `neko` (uid 1000),
# passwordless sudo, supervisord as pid 1. There is NO systemd and NO launchd in
# there, so [bootstrap.linux.systemd.units] is useless: mise writes those with
# `systemctl --user`, which has nothing to talk to.
#
# THE constraint: only /home/neko is on a PVC. /usr and /etc come from the image
# and are wiped on every pod roll. So:
#   - [bootstrap.packages] is deliberately tiny — it is a per-start cost, paid
#     again every time the pod is rescheduled;
#   - real tooling goes in [tools], which installs under ~/.local/share/mise and
#     therefore survives (this is why the inherited tool list is left alone);
#   - GUI apps are [tools] entries too, not apt (see the tools section below);
#   - ~/.config/autostart/mise-bootstrap.desktop re-runs bootstrap at every XFCE
#     session start, which is what makes a fresh container reprovision itself.
#     That is the launchd-agent equivalent for this box.

# ── Tools, including the GUI apps ───────────────────────────────────────────
# The GUI apps are ordinary [tools] entries: mise picks the asset for the
# architecture, downloads, verifies, extracts, records a checksum in mise.neko.lock
# and puts the binary on PATH as a shim. Installs land in ~/.local/share/mise,
# which is on the PVC, so they survive a pod roll like every other tool.
#
# Why not the other managers:
#   brew      installs into /home/linuxbrew/.linuxbrew — not on the PVC — and on
#             Linux `brew-cask` is font-casks only. No GUI apps that way.
#   apt       /usr is image state, so it is a fresh download every pod roll.
#   flatpak   needs bubblewrap to create a user namespace (blocked here), and a
#             sandboxed VS Code cannot see the mise toolchain without
#             --filesystem grants and flatpak-spawn.
#
# These lived in conf.d/neko-apps.neko.toml until the lockfile arrived. mise
# writes one lockfile per config FILE, but groups every conf.d fragment into a
# single lockfile at ~/.config/mise/mise.lock — outside the repo, so a fragment's
# tools can never be checksummed in git. These are the pinned `http:` vendor URLs,
# which are exactly what most needs a recorded checksum, so they moved here where
# the lockfile is mise.neko.lock and is committed.
#
# ADDING AN APP (one file now — this one)
#   1. a [tools] entry below — `github:` with extract_all for a release archive,
#      or `http:` with a [platforms] table for a vendor URL;
#   2. a .desktop file in home/xfce/applications/, and its [dotfiles] line below.
#   The .desktop Exec points at ~/.local/share/mise/shims/<name>, which is stable
#   across version bumps, so upgrading an app never means touching the menu entry.
#
# `http:` entries are PINNED — bumping one is editing the version and its two
# URLs, then `mise lock`. `github:` entries track latest by themselves.
#
# Obsidian has to be `http:` even though it lives on GitHub: that repo publishes
# Android APK releases as "latest", and the github backend then fails with "could
# not find a release asset after filtering for archive files from *.apk".
#
# os = "linux" on each app: a stray MISE_ENV=neko on a Mac would otherwise try to
# install them and fail with "No URL for platform macos-arm64".
[tools]
starship = "latest"   # fish prompt; p10k is zsh-only (see home/starship.toml)
"github:zen-browser/desktop" = { version = "latest", extract_all = true, exe = "zen", os = "linux" }

[tools."http:vscode"]
os = "linux"
version = "1.136.1"
strip_components = 1
bin_path = "bin"                  # the launcher is bin/code, next to a bin/ dir of helpers
[tools."http:vscode".platforms]
linux-x64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-x64/stable" }
linux-arm64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-arm64/stable" }

[tools."http:obsidian"]
os = "linux"
version = "1.13.7"
strip_components = 1
[tools."http:obsidian".platforms]
linux-x64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7.tar.gz" }
linux-arm64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7-arm64.tar.gz" }

[env]
# Debian ships C.UTF-8 without the `locales` package; enough for tmux -u.
LANG = "C.UTF-8"
# Cancels the value mise.toml sets: that socket is served by the Proton Pass
# ssh-agent, which does not run here (see the secrets note in the header), so
# leaving it set just points ssh at a socket that will never exist.
SSH_AUTH_SOCK = false
# pass-cli's default backend keeps its local key in the KERNEL keyring, and this
# container's seccomp profile blocks add_key/keyctl — it fails with
# NoStorageAccess(PermissionDenied) before a login can even start. `fs` keeps the
# key beside the session under ~/.local/share/proton-pass-cli, which is on the
# PVC, so both survive a pod roll. (`env` is the other option: the key would then
# come from PROTON_PASS_ENCRYPTION_KEY.)
PROTON_PASS_KEY_PROVIDER = "fs"
# The image is UTC; timestamps in logs and editors should match the Macs.
TZ = "America/New_York"
# EDITOR is inherited as `code --wait` — valid here because the [tools] below
# install VS Code into ~/.local/share/mise. Drop that entry and override this too.

# ── System packages ─────────────────────────────────────────────────────────
# Everything here is reinstalled on each container start. Keep it to things that
# genuinely cannot live in $HOME — either base tooling, or a shared library one
# of the GUI apps above needs and the neko base image lacks.
[bootstrap.packages]
"apt:git" = "latest"       # not in the neko base image; needed to clone this repo
"apt:fish" = "latest"      # the shell here; the Macs stay on zsh + z4h
"apt:tmux" = "latest"      # survives a dropped WebRTC session
"apt:less" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"  # .tar.xz app tarballs
"apt:xdg-utils" = "latest" # xdg-open / default browser
"apt:fontconfig" = "latest" # fc-cache, for the Nerd Font the bootstrap task drops in $HOME
# Shared libraries the neko base image lacks, for the GUI apps in [tools].
# (Verified against Debian trixie — hence the t64 suffix on libasound.)
"apt:libnss3" = "latest"          # Electron (VS Code, Obsidian)
"apt:libnspr4" = "latest"
"apt:libasound2t64" = "latest"
"apt:libgbm1" = "latest"
"apt:libxkbfile1" = "latest"
"apt:libxss1" = "latest"
"apt:libsecret-1-0" = "latest"    # VS Code keyring
"apt:libdbus-glib-1-2" = "latest" # Zen (Gecko)

# The image cleans /var/lib/apt/lists, so apt has no index on a fresh container.
# NOTE: hooks with the same name in different configs ACCUMULATE, they do not
# override — mise.toml's pre-packages hook still runs here, right before this
# one. That is fine (it exits immediately on non-Darwin), but it is the opposite
# of how [tasks.bootstrap] below behaves, which does override.
[bootstrap.hooks.pre-packages]
run = '''
[ "$(uname)" = "Linux" ] || exit 0
sudo apt-get update -qq
'''

# ── Dotfiles ────────────────────────────────────────────────────────────────
# On top of the shared set in mise.toml — which is now only the four entries that
# genuinely belong on both machine classes (git, ssh, the two kubeconfigs). The
# zsh files used to land here too and be ignored; they are scoped `os = "macos"`
# with `variants` now, so the container no longer collects them.
[dotfiles]
"~/.config/fish/config.fish" = { source = "home/fish/config.fish", mode = "symlink" }
# symlink-each, not symlink: fish writes fish_variables and its own generated
# completions into conf.d's parent, so only the files we own are linked.
"~/.config/fish/conf.d"      = { source = "home/fish/conf.d", mode = "symlink-each" }
"~/.config/starship.toml"    = { source = "home/starship.toml", mode = "symlink" }
# symlink-each links the files inside home/bin individually, so mise's own
# binary already in ~/.local/bin is left alone.
"~/.local/bin"                               = { source = "home/bin", mode = "symlink-each" }
"~/.config/autostart/mise-bootstrap.desktop" = { source = "home/xfce/mise-bootstrap.desktop.tmpl", mode = "template" }
"~/.config/xfce4/terminal/terminalrc"        = { source = "home/xfce/terminalrc", mode = "symlink" }
# Menu entries for the GUI apps in [tools]. Static files rather than a script:
# they point at mise's shims, whose paths do not change when a version does.
# template mode because .desktop files do not expand `~`.
"~/.local/share/applications/code.desktop"     = { source = "home/xfce/applications/code.desktop.tmpl", mode = "template" }
"~/.local/share/applications/obsidian.desktop" = { source = "home/xfce/applications/obsidian.desktop.tmpl", mode = "template" }
"~/.local/share/applications/zen.desktop"      = { source = "home/xfce/applications/zen.desktop.tmpl", mode = "template" }
"~/.config/mimeapps.list"                      = { source = "home/xfce/mimeapps.list", mode = "symlink" }

# scripts/ is not a dotfile source; neko-bootstrap calls scripts/pass-preflight
# straight out of the repo checkout at ~/.dotfiles, so nothing to link here.

# Secrets work here the same way as on the Macs — fnox over Proton Pass — once
# PROTON_PASS_KEY_PROVIDER (above) sidesteps the blocked kernel keyring. The only
# difference is how the session starts: a session-start bootstrap has no TTY, so
# scripts/pass-preflight logs in from PASS_CLI_PAT (a Proton Pass Personal Access
# Token delivered by the k8s secret) instead of prompting. Values can still come
# from mise.local.toml [vars] instead, which wins over fnox.
#
# --force-dotfiles: apps write their own defaults before bootstrap runs (fish
# creates ~/.config/fish/config.fish on first shell), and mise will not replace a
# regular file with a symlink without it.
[tasks.apply]
description = "Install everything (packages, dotfiles, tools, XFCE settings) with secrets"
dir = "{{env.HOME}}/.dotfiles"
run = """
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --yes --force-dotfiles
"""

# ── Doctor checks (container-specific) ──────────────────────────────────────
# On top of the shared ones in mise.toml. `mise doctor project`.
[doctor.checks.neko-hold]
description = "session-start provisioning is not parked"
hint = "rm ~/.neko-hold to resume, then run `neko-bootstrap`"
run = '''
[ -e "$HOME/.neko-hold" ] || exit 0
echo "~/.neko-hold is present — neko-bootstrap exits before doing anything,"
echo "so this desktop is NOT reprovisioning itself at session start."
exit 1
'''

[doctor.checks.neko-autostart]
description = "the autostart entry that reprovisions a rolled pod exists"
hint = "run `mise bootstrap --only dotfiles --force-dotfiles`"
run = '''
f="$HOME/.config/autostart/mise-bootstrap.desktop"
[ -f "$f" ] || { echo "missing $f — a rolled pod would come back unprovisioned"; exit 1; }
[ -x "$HOME/.local/bin/neko-bootstrap" ] || { echo "~/.local/bin/neko-bootstrap missing or not executable"; exit 1; }
'''

# ── Repos ───────────────────────────────────────────────────────────────────
# Cloned to the same paths as on the Macs, so muscle memory and any absolute
# path in a note still works. Deliberately NOT in the shared config: on a Mac
# these directories already exist with real work in them, and a bootstrap that
# tries to converge them is a good way to lose an afternoon.
#
# `mise bootstrap` re-runs this every session start, so neko-bootstrap passes
# --skip-dirty: without it a single repo with uncommitted changes fails the whole
# bootstrap, which on this box means the desktop stops provisioning entirely.
[bootstrap.repos]
"~/Repositories/home-ops"            = { url = "https://github.com/h-wb/home-ops.git" }
"~/Repositories/dawarich-regression" = { url = "https://github.com/h-wb/dawarich-regression.git" }
"~/Repositories/codex"               = { url = "https://github.com/h-wb/codex.git" }
"~/Repositories/sync-anilist"        = { url = "https://github.com/h-wb/codex-plugins.git" }
"~/Repositories/sento"               = { url = "https://github.com/h-wb/sento.git" }
"~/Repositories/main-go-brrr"        = { url = "https://github.com/h-wb/main-go-brrr.git" }
"~/Repositories/dlt"                 = { url = "https://github.com/h-wb/pipelines.git" }
# upstreams and references, read-only in practice
"~/Repositories/dawarich"            = { url = "https://github.com/Freika/dawarich.git" }
"~/Repositories/onedr0p"             = { url = "https://github.com/onedr0p/home-ops.git" }
"~/Repositories/jory"                = { url = "https://github.com/joryirving/home-ops.git" }
"~/Repositories/vrozaksen"           = { url = "https://github.com/vrozaksen/home-ops.git" }

# Git auth has to exist BEFORE the repos step, and the bootstrap order makes that
# awkward: repos are step 10, dotfiles step 11, tools step 17. So on a fresh PVC
# there is no gh yet and no rendered git config — hence a plain credentials file
# written here from the fnox-injected token, which needs nothing but shell.
# `gh` itself is logged in later, in the bootstrap task, for interactive use.
[bootstrap.hooks.pre-repos]
run = """
[ -n "${GH_TOKEN:-}" ] || { echo "[info] no GH_TOKEN; private repos will not clone"; exit 0; }
umask 077
printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
git config --global credential.helper store
echo "[info] git credentials configured from GH_TOKEN"
"""

# ── Tasks ───────────────────────────────────────────────────────────────────
# Overrides mise.toml's `bootstrap` task — same-named tasks replace rather than
# merge, so the shared body's ssh chmod is repeated here; only its /etc/resolver
# block is dropped, which was macOS-only. Also pulls in the two fragments. `mise bootstrap` runs this at step 15,
# after packages/dotfiles/tools, so xfconf can rely on everything else already
# being in place.
[tasks.bootstrap]
depends = ["neko:xfce"]
run = '''
[ -d "$HOME/.ssh" ] && chmod 700 "$HOME/.ssh" || true

# Login shell for `kubectl exec` shells. /etc/passwd is image state, so this is
# re-applied every roll; the terminal emulator gets fish from terminalrc instead.
FISH="$(command -v fish || true)"
if [ -n "$FISH" ] && [ "$(getent passwd "$(id -un)" | cut -d: -f7)" != "$FISH" ]; then
  sudo chsh -s "$FISH" "$(id -un)" || true
fi

# Glyphs for the starship prompt. ~/.local/share/fonts is on the PVC, so this is a one-time cost.
FONTDIR="$HOME/.local/share/fonts"
mkdir -p "$FONTDIR"
for style in "Regular" "Bold" "Italic" "Bold Italic"; do
  target="$FONTDIR/MesloLGS NF $style.ttf"
  [ -f "$target" ] && continue
  url="https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20$(echo "$style" | sed 's/ /%20/g').ttf"
  curl -fsSL "$url" -o "$target" || rm -f "$target"
done
command -v fc-cache >/dev/null 2>&1 && fc-cache -f "$FONTDIR" >/dev/null 2>&1 || true

# Persist the token into gh's own config (~/.config/gh, on the PVC) so `gh` works
# in a terminal later, where GH_TOKEN is not in the environment.
#
# Both `env -u` are load-bearing. While GH_TOKEN is set, `gh auth status` reports
# "logged in (GH_TOKEN)" — so the obvious `! gh auth status` guard is always false
# and this block never runs — and `gh auth login` refuses outright: "The value of
# the GH_TOKEN environment variable is being used for authentication ... first
# clear the value from the environment."
if [ -n "${GH_TOKEN:-}" ] && command -v gh >/dev/null 2>&1 &&
  ! env -u GH_TOKEN -u GITHUB_TOKEN gh auth status >/dev/null 2>&1; then
  if printf %s "$GH_TOKEN" | env -u GH_TOKEN -u GITHUB_TOKEN gh auth login --with-token; then
    echo "[info] gh authenticated and stored"
  else
    echo "[warn] gh auth login failed"
  fi
fi

# The image is UTC and /etc resets on every pod roll, so this is re-applied each
# session. mise [env] TZ covers mise-run processes; this covers the desktop apps
# and any plain shell, which never see mise's env.
WANT_TZ="America/New_York"
if [ -f "/usr/share/zoneinfo/$WANT_TZ" ] &&
  [ "$(readlink /etc/localtime 2>/dev/null)" != "/usr/share/zoneinfo/$WANT_TZ" ]; then
  sudo ln -sf "/usr/share/zoneinfo/$WANT_TZ" /etc/localtime &&
    echo "[info] timezone set to $WANT_TZ"
fi
'''
