# The owner's code-server pod (set `code-server` = workstation + pod +
# nonroot + fish):
# ghcr.io/coder/code-server, user `coder`. Only what is about this image is
# here; the pod layer has the bootstrap and its doctor check.

# The image has no fish, and the pod cannot keep a system package: fish's own
# static build, into the home volume.
[tools]
"github:fish-shell/fish-shell" = "4.9.3"

[dotfiles]
# The image's login shell is bash, and /etc does not survive a pod roll: the
# editor's terminal starts fish here instead. By its install path, not the shim:
# a shim exits 1 in any folder whose mise config errors, leaving no terminal to
# fix it from. Machine scope, not User: the settings UI writes
# User/settings.json, which stays the owner's.
"~/.local/share/code-server/Machine/settings.json" = { source = "settings.json.tmpl", mode = "template" }
