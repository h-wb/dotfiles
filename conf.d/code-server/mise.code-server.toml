# The owner's code-server pod (class `code-server` = workstation + pod + zsh):
# ghcr.io/coder/code-server, user `coder`. Only what is about this image is
# here; home-ops' dotfiles Component runs scripts/pod-bootstrap at every start.

[dotfiles]
# The image's login shell is bash, and /etc does not survive a pod roll: the
# editor's terminal picks zsh here instead. Machine scope, not User: the
# settings UI writes User/settings.json, which stays the owner's.
"~/.local/share/code-server/Machine/settings.json" = { source = "settings.json", mode = "symlink" }

# Here until neko also runs pod-bootstrap; then it moves to the pod layer.
# The pod always starts, so a failed run only shows here.
[doctor.checks.pod-bootstrap]
description = "the last pod start provisioned this pod with secrets"
hint = "see ~/.local/state/pod-bootstrap.log; rerun with ~/.dotfiles/scripts/pod-bootstrap"
run = '''
f="$HOME/.local/state/pod-bootstrap.status"
[ -f "$f" ] || { echo "no $f: pod-bootstrap has not completed on this pod"; exit 1; }
read -r result mode _ <"$f"
[ "$result" = ok ] || { echo "the last pod-bootstrap failed (mode $mode)"; exit 1; }
[ "$mode" = secrets ] || { echo "the last pod start ran in mode $mode: no Proton Pass session (PROTON_PASS_TOKEN)"; exit 1; }
'''
