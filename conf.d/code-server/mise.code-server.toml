# The code-server pod: only what is about its image (README.md).

# The image has no fish, and a system package would not survive a roll.
[tools]
"github:fish-shell/fish-shell" = "4.9.3"

[dotfiles]
# Fish by its install path, not the shim: a shim exits 1 in a folder whose mise
# config errors, leaving no terminal. Machine scope: User is the settings UI's.
"~/.local/share/code-server/Machine/settings.json" = { source = "settings.json.tmpl", mode = "template" }
