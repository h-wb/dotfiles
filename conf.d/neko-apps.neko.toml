# GUI apps for the neko desktop — the brew-cask list's counterpart.
#
# These are ordinary [tools] entries: mise picks the asset for the architecture,
# downloads, verifies, extracts, records a checksum in the lockfile and puts the
# binary on PATH as a shim. Installs land in ~/.local/share/mise, which is on the
# PVC, so they survive a pod roll like every other tool.
#
# Why not the other managers:
#   brew      installs into /home/linuxbrew/.linuxbrew — not on the PVC — and on
#             Linux `brew-cask` is font-casks only. No GUI apps that way.
#   apt       /usr is image state, so it is a fresh download every pod roll.
#   flatpak   needs bubblewrap to create a user namespace (blocked here), and a
#             sandboxed VS Code cannot see the mise toolchain without
#             --filesystem grants and flatpak-spawn.
#
# ADDING AN APP
#   1. a [tools] entry below — `github:` with extract_all for a release archive,
#      or `http:` with a [platforms] table for a vendor URL;
#   2. a .desktop file in home/xfce/applications/, and its [dotfiles] line in
#      mise.neko.toml.
#   That is all: there is no installer script and no catalog. The .desktop Exec
#   points at ~/.local/share/mise/shims/<name>, which is stable across version
#   bumps, so upgrading an app never means touching the menu entry.
#
# `http:` entries are PINNED — bumping one is editing the version and its two
# URLs. `github:` entries track latest by themselves.
#
# Obsidian has to be `http:` even though it lives on GitHub: that repo publishes
# Android APK releases as "latest", and the github backend then fails with "could
# not find a release asset after filtering for archive files from *.apk".

# Shared libraries the neko base image lacks. Reinstalled on every pod roll, so
# kept to what the Electron/Gecko apps actually need. (Verified against Debian
# trixie — hence the t64 suffix on libasound.)
[bootstrap.packages]
"apt:libnss3" = "latest"          # Electron (VS Code, Obsidian)
"apt:libnspr4" = "latest"
"apt:libasound2t64" = "latest"
"apt:libgbm1" = "latest"
"apt:libxkbfile1" = "latest"
"apt:libxss1" = "latest"
"apt:libsecret-1-0" = "latest"    # VS Code keyring
"apt:libdbus-glib-1-2" = "latest" # Zen (Gecko)

# os = "linux" on each: the fragment is neko-scoped already, but a stray
# MISE_ENV=neko on a Mac would otherwise try to install these and fail with
# "No URL for platform macos-arm64" (or quietly install a macOS build).
[tools]
"github:zen-browser/desktop" = { version = "latest", extract_all = true, exe = "zen", os = "linux" }

[tools."http:vscode"]
os = "linux"
version = "1.136.1"
strip_components = 1
bin_path = "bin"                  # the launcher is bin/code, next to a bin/ dir of helpers
[tools."http:vscode".platforms]
linux-x64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-x64/stable" }
linux-arm64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-arm64/stable" }

[tools."http:obsidian"]
os = "linux"
version = "1.13.7"
strip_components = 1
[tools."http:obsidian".platforms]
linux-x64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7.tar.gz" }
linux-arm64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7-arm64.tar.gz" }
