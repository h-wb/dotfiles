# GUI apps for the neko desktop — the brew-cask list's counterpart.
#
# These are ordinary [tools] entries. mise does the whole job: picks the right
# asset for the architecture, downloads, verifies, extracts, records a checksum
# in the lockfile and puts the binary on PATH as a shim. Installs land in
# ~/.local/share/mise, which is on the PVC, so they survive a pod roll like every
# other tool. The only thing mise does not do is write XFCE menu entries, which
# is all the task at the bottom is for.
#
# Why not the other managers:
#   brew      installs into /home/linuxbrew/.linuxbrew — not on the PVC — and on
#             Linux `brew-cask` is font-casks only. No GUI apps that way.
#   apt       /usr is image state, so it is a fresh download every pod roll.
#   flatpak   needs bubblewrap to create a user namespace (unverified here), and
#             a sandboxed VS Code cannot see the mise toolchain without
#             --filesystem grants and flatpak-spawn.
#
# ADDING AN APP
#   From GitHub releases:  a `github:` entry with extract_all (the archive is a
#   whole app tree, not one binary) and `exe` naming the launcher.
#   From a vendor URL:     an `http:` entry with a [platforms] table. Note these
#   are PINNED: bumping is editing the version and the two URLs. `github:` ones
#   track latest on their own.
#
# Obsidian has to be `http:` rather than `github:` even though it is on GitHub:
# that repo publishes Android APK releases as "latest", and the backend then
# fails with "could not find a release asset after filtering for archive files
# from Obsidian-x.y.z.apk". Pinning sidesteps it.

# Shared libraries the neko base image lacks. Reinstalled on every pod roll, so
# kept to what the Electron/Gecko apps actually need. (Verified against Debian
# trixie — hence the t64 suffix on libasound.)
[bootstrap.packages]
"apt:libnss3" = "latest"          # Electron (VS Code, Obsidian)
"apt:libnspr4" = "latest"
"apt:libasound2t64" = "latest"
"apt:libgbm1" = "latest"
"apt:libxkbfile1" = "latest"
"apt:libxss1" = "latest"
"apt:libsecret-1-0" = "latest"    # VS Code keyring
"apt:libdbus-glib-1-2" = "latest" # Zen (Gecko)

# os = "linux" on each: the fragment is neko-scoped already, but a stray
# MISE_ENV=neko on a Mac would otherwise try to install these and fail with
# "No URL for platform macos-arm64" (or quietly install a macOS build).
[tools]
"github:zen-browser/desktop" = { version = "latest", extract_all = true, exe = "zen", os = "linux" }

[tools."http:vscode"]
os = "linux"
version = "1.136.1"
strip_components = 1
bin_path = "bin"                  # the launcher is bin/code, next to a bin/ dir of helpers
[tools."http:vscode".platforms]
linux-x64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-x64/stable" }
linux-arm64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-arm64/stable" }

[tools."http:obsidian"]
os = "linux"
version = "1.13.7"
strip_components = 1
[tools."http:obsidian".platforms]
linux-x64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7.tar.gz" }
linux-arm64 = { url = "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/obsidian-1.13.7-arm64.tar.gz" }


# The one gap: mise puts the binaries on PATH but XFCE's menu needs .desktop
# files. This resolves each shim with `mise which`, so it always points at the
# version mise actually installed, and re-runs harmlessly after an upgrade.
#
# --no-sandbox on the Electron apps: Chromium's sandbox wants user namespaces,
# which an unprivileged pod does not get.
[tasks."neko:apps"]
description = "Write XFCE menu entries for the GUI apps installed by [tools]"
run = '''
set -eu
[ "$(uname)" = "Linux" ] || { echo "[skip] linux only"; exit 0; }
APPS="$HOME/.local/share/applications"
mkdir -p "$APPS"

while IFS='|' read -r bin display cats args icon; do
  case "$(printf %s "$bin" | tr -d ' \t')" in '' | '#'*) continue ;; esac
  bin="$(printf %s "$bin" | xargs)";   display="$(printf %s "$display" | xargs)"
  cats="$(printf %s "$cats" | xargs)"; args="$(printf %s "$args" | xargs)"
  icon="$(printf %s "${icon:-}" | xargs)"
  if [ "$args" = "-" ]; then args=""; fi

  exe="$(mise which "$bin" 2>/dev/null)" || exe=""
  if [ -z "$exe" ] || [ ! -x "$exe" ]; then
    echo "[skip] $bin is not installed"
    continue
  fi

  # Icon column: a path relative to the install dir, an icon-theme name, or `-`
  # to search the tree. Searching rarely works — VS Code, Obsidian and Zen all
  # pack their icons into archives rather than shipping a loose file — which is
  # why the catalog names theme icons instead.
  case "$icon" in
  '' | '-')
    icon="$(find "$(dirname "$exe")" -maxdepth 5 -type f \( -name '*.png' -o -name '*.svg' \) \
      \( -ipath "*$bin*" -o -ipath '*icon*' \) 2>/dev/null | sort | head -1)"
    [ -n "$icon" ] || icon="applications-other"
    ;;
  */*)
    # relative to the install dir; fall back to generic if it is not there
    if [ -f "$(dirname "$exe")/$icon" ]; then
      icon="$(dirname "$exe")/$icon"
    else
      icon="applications-other"
    fi
    ;;
  esac

  cat > "$APPS/$bin.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=$display
Exec=$exe $args %U
Icon=$icon
Categories=$cats
Terminal=false
StartupNotify=true
EOF
  echo "[ok] $bin -> $exe"
done <<'CATALOG'
# shim | display name       | categories           | extra args   | icon (theme name, path under the install dir, or - to search)
code     | Visual Studio Code | Development;IDE;     | --no-sandbox | applications-development
obsidian | Obsidian           | Office;TextEditor;   | --no-sandbox | accessories-text-editor
zen      | Zen Browser        | Network;WebBrowser;  | -            | web-browser
CATALOG

command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database "$APPS" 2>/dev/null || true
command -v xdg-settings >/dev/null 2>&1 && xdg-settings set default-web-browser zen.desktop 2>/dev/null || true
'''
