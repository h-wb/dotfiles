# Zen history → Nextcloud → the dlt `browser_history` pipeline (~/Repositories/dlt).

[tools]
sqlite = "latest"

# Zen holds an exclusive lock, so `.backup` fails: copy the DB + WAL, check the
# copy (a write can land mid-copy; the next run retries), VACUUM INTO one file,
# and rename it into place so Nextcloud never uploads a partial one.
[tasks.zen-history-snapshot]
description = "Snapshot Zen's history DB into Nextcloud"
env = { ZEN_PROFILES = "{{env.HOME}}/Library/Application Support/zen/Profiles", ZEN_SNAPSHOT_DIR = "{{env.HOME}}/Nextcloud/Hugo/Documents/data/browser" }
run = '''
set -eu
src="$(ls -t "$ZEN_PROFILES"/*/places.sqlite | head -1)"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cp "$src" "$tmp/places.sqlite"
[ -f "$src-wal" ] && cp "$src-wal" "$tmp/places.sqlite-wal"
check="$(sqlite3 "$tmp/places.sqlite" 'PRAGMA quick_check;')"
[ "$check" = "ok" ] || { echo "$(date -u +%FT%TZ) copy not consistent, skipping: $check" >&2; exit 1; }
sqlite3 "$tmp/places.sqlite" "VACUUM INTO '$tmp/zen-places.sqlite';"
gzip -9 "$tmp/zen-places.sqlite"
mkdir -p "$ZEN_SNAPSHOT_DIR"
mv "$tmp/zen-places.sqlite.gz" "$ZEN_SNAPSHOT_DIR/zen-places.sqlite.gz"
echo "$(date -u +%FT%TZ) snapshot ok: $src"
'''

# Every 6h (a missed run happens once on wake). launchd has no PATH, hence the absolute mise.
[bootstrap.macos.launchd.agents.zen-history-snapshot]
program = "/bin/sh"
args = [
  "-c",
  "exec \"$HOME/.local/bin/mise\" run --quiet zen-history-snapshot >> \"$HOME/Library/Logs/zen-history-snapshot.log\" 2>&1",
]
run_at_load = true
start_interval = 21600
