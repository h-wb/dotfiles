# Layer `pod`: the Linux pods in home-ops (neko, paseo). Only $HOME is on a PVC, and
# both reprovision at every start with --skip-dirty, so one dirty repo cannot stop it
# (neko: bin/neko-bootstrap; paseo: `mise bootstrap --from` in its pod spec).

[tools]
tmux = "latest"   # mise, not apt: /usr is wiped every pod roll

[env]
LANG = "C.UTF-8"  # Debian ships C.UTF-8 without `locales`

[bootstrap.repos]
"~/Repositories/home-ops" = { url = "https://github.com/h-wb/home-ops.git" }
