# k8s-gateway DNS (MacBook): one zone, two clusters, pick one.
#   mise run dns:main | dns:edge | dns:use <cluster> | dns:status
# Both clusters are authoritative for the same zone with no `fallthrough`, so
# a second nameserver line buys nothing: the other cluster's routes NXDOMAIN.

# Saved per machine by dns:use (`mise vars`). A config file or a lowercase
# `k8s_dns_cluster` env var (what CI uses) outranks the saved answer.
[vars]
k8s_dns_zone = "wlab.ovh"

[vars.k8s_dns_cluster]
default = "main"

# Bootstrap secrets: a missing one aborts before anything is written, so the
# resolver can never be rewritten without a nameserver. Only the selected
# branch is resolved.
[bootstrap.secrets]
k8s_gateway_ip_main = "K8S_GATEWAY_IP_MAIN"
k8s_gateway_ip_edge = "K8S_GATEWAY_IP_EDGE"

# Keys aren't templated, so the zone is spelled out (the doctor check below
# asserts it matches vars.k8s_dns_zone). An unknown cluster falls back to main.
[bootstrap.files."/etc/resolver/wlab.ovh"]
template = true
owner = "root"
group = "wheel"
mode = "0644"
content = '''
{%- if vars.k8s_dns_cluster == "edge" %}nameserver {{ secret(name="k8s_gateway_ip_edge") }}
{% else %}nameserver {{ secret(name="k8s_gateway_ip_main") }}
{% endif -%}
'''

# ── Tasks ───────────────────────────────────────────────────────────────────
# The read-back catches a higher source that would revert the switch on the
# next apply. Without the flush, lookups keep the old answer.
[tasks."dns:use"]
description = "Resolve the internal zone via one cluster's k8s-gateway (saved for this machine)"
usage = 'arg "<cluster>" { choices "main" "edge"; }'
run = '''
mise vars k8s_dns_cluster="{{ usage.cluster }}" || exit 1
[ "$(mise vars k8s_dns_cluster)" = "{{ usage.cluster }}" ] ||
	{ echo "saved, but overridden: $(mise vars ls --no-header | grep '^k8s_dns_cluster ')" >&2; exit 1; }
cd "{{ vars.repo }}"
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap files apply --yes || exit 1
sudo dscacheutil -flushcache
sudo killall -HUP mDNSResponder
mise run dns:status
'''

[tasks."dns:main"]
description = "Resolve the internal zone via the main cluster's k8s-gateway"
run = "mise run dns:use main"

[tasks."dns:edge"]
description = "Resolve the internal zone via the edge cluster's k8s-gateway"
run = "mise run dns:use edge"

[tasks."dns:status"]
description = "Show which cluster resolves the internal zone"
run = '''
zone="{{ vars.k8s_dns_zone }}"
echo "selected: {{ vars.k8s_dns_cluster }}"
echo "resolver: $(cat "/etc/resolver/$zone" 2>/dev/null || echo '<not installed>')"
echo "lookup:   k8s-gateway.network.$zone ->$(dscacheutil -q host -a name "k8s-gateway.network.$zone" | awk '/^ip_address:/ { printf " %s", $2 }')"
'''

# Comparing against the selection needs the secrets, so that half only runs
# with a live Proton Pass session (doctor never prompts). `files status` exits
# 0 even on a diff, hence the match on the resolver's own row.
[doctor.checks.k8s-dns]
description = "/etc/resolver matches the selected k8s-gateway ({{ vars.k8s_dns_cluster }})"
hint = "run `mise run dns:main` or `mise run dns:edge`"
run = '''
zone="{{ vars.k8s_dns_zone }}"
cd "{{ vars.repo }}" || exit 1
grep -qF "[bootstrap.files.\"/etc/resolver/$zone\"]" conf.d/k8s-dns/mise.personal.toml ||
	{ echo "the [bootstrap.files] key does not match vars.k8s_dns_zone ($zone)"; exit 1; }
grep -q '^nameserver ' "/etc/resolver/$zone" 2>/dev/null ||
	{ echo "/etc/resolver/$zone is missing or has no nameserver"; exit 1; }
DOTFILES_NO_LOGIN=1 ./scripts/pass-preflight 2>/dev/null || { echo "(no Proton Pass session; selection not compared)"; exit 0; }
fnox --if-missing error exec -c fnox.toml -- mise bootstrap files status 2>/dev/null |
	grep -qE "^unchanged +file:/etc/resolver/$zone " ||
	{ echo "/etc/resolver/$zone differs from the {{ vars.k8s_dns_cluster }} selection"; exit 1; }
'''
