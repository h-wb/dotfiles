# macOS defaults, split out of mise.toml to keep the main config scannable.
# Loaded as a global conf.d fragment (install.sh symlinks ~/.config/mise/conf.d
# to this repo's conf.d/). Merges into the config like any other section.
#
# mise defaults are scalar-only; the three non-scalar values (Dock persistent-apps
# array, AppleSymbolicHotKeys nested dict, ByHost battery %) + the killall live in
# the post-defaults hook at the bottom.

[bootstrap.macos.defaults."NSGlobalDomain"]
ApplePressAndHoldEnabled = false            # repeat key instead of accent popup
KeyRepeat = 2                               # fast key repeat
InitialKeyRepeat = 10
AppleShowAllExtensions = true
NSNavPanelExpandedStateForSaveMode = true   # expand save panel by default
AppleHighlightColor = "0.698039 0.843137 1.000000"
CGDisableCursorLocationMagnification = 1    # disable shake-to-locate cursor
"com.apple.trackpad.scaling" = 1            # trackpad speed (0-3)
NSAutomaticCapitalizationEnabled = 0        # do not change what I type
NSAutomaticDashSubstitutionEnabled = 0
NSAutomaticPeriodSubstitutionEnabled = 0
NSAutomaticQuoteSubstitutionEnabled = 0
NSAutomaticSpellingCorrectionEnabled = 0
NSInlinePredictionEnabled = 0

[bootstrap.macos.defaults."com.apple.dock"]
workspaces-auto-swoosh = false              # no Spaces auto-switching
static-only = true                          # show only open apps
show-recents = false
tilesize = 50
autohide = true
autohide-delay = 0
autohide-time-modifier = 0
wvous-tl-corner = 0                          # hot corners: all no-op
wvous-tl-modifier = 0
wvous-tr-corner = 0
wvous-tr-modifier = 0
wvous-bl-corner = 0
wvous-bl-modifier = 0
wvous-br-corner = 0
wvous-br-modifier = 0

[bootstrap.macos.defaults."com.apple.finder"]
CreateDesktop = false                       # hide desktop icons
NewWindowTarget = "PfHm"                     # new windows open at $HOME
FXPreferredViewStyle = "clmv"                # column view
ShowPathbar = true
ShowStatusBar = true
FXEnableExtensionChangeWarning = false
FXPreferredGroupBy = "Name"
FXArrangeGroupViewBy = "Name"
WarnOnEmptyTrash = false
FXRemoveOldTrashItems = true                # auto-empty Trash after 30 days

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true                             # tap to click
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.hegenberg.BetterTouchTool"]
BTTDisabledLegacyUI = 1
BTTForcedHidden = 0                          # show menubar icon
BTTThreeFingerDragCompatibilityMode = 1
BTTRemoteEnabled = 0
BTTTouchBarVisible = 0

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true             # no .DS_Store on network/USB
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.lwouis.alt-tab-macos"]
updatePolicy = "2"                           # auto-update
crashPolicy = "0"
MSAppCenterNetworkRequestsAllowed = false
menubarIconShown = "false"
"NSStatusItem VisibleCC Item-0" = false
holdShortcut = "⌘"
appearanceStyle = "2"                        # macOS Ventura style
appearanceSize = "3"
previewFadeInAnimation = "false"
previewFocusedWindow = "true"
windowDisplayDelay = "0"
appsToShow = "0"                             # all apps
screensToShow = "0"                          # all screens
spacesToShow = "1"                           # all spaces
showWindowlessApps = "1"
showTabsAsWindows = "false"
showOnScreen = "1"
hideSpaceNumberLabels = "false"
settingsWindowShownOnFirstLaunch = "true"

[bootstrap.macos.defaults."com.apple.screencapture"]
name = "Screenshot"
show-thumbnail = false                       # no floating thumbnail
type = "png"

[bootstrap.macos.defaults."com.apple.controlcenter"]
"NSStatusItem Visible Bluetooth" = true      # (battery % is ByHost, set in the hook)

[bootstrap.macos.defaults."com.raycast.macos"]
onboardingCompleted = true
raycastGlobalHotkey = "Command-49"           # Cmd-Space
"NSStatusItem Visible raycastIcon" = false

# ── The three values [bootstrap.macos.defaults] above cannot express ────────
# That table is scalar-only, so an array, a nested dict and a ByHost value used to
# live in a `[bootstrap.hooks.post-defaults]` shell hook shelling out to
# `defaults`. mise 2026.9.5 added [[bootstrap.macos.defaults_entries]], which
# covers all three declaratively: `value` takes real TOML types (arrays included),
# `path` addresses a nested key inside a shared dictionary without replacing its
# siblings, and `host = "current"` is `defaults -currentHost`.
#
# Still no killall anywhere: Dock/Finder/SystemUIServer respawn, but
# Raycast/AltTab/BTT would just be quit and left dead. Changes take effect on the
# next relaunch or login.

# Empty the Dock. `value = []` is the array `defaults write -array` wrote.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.dock"
key = "persistent-apps"
value = []

# Disable the Cmd-Space Spotlight hotkey so Raycast can have it. Hotkey 64 is one
# entry in the shared AppleSymbolicHotKeys dict, hence `path` — writing the whole
# key would drop every other shortcut. Each path component is a literal key (dots
# are not separators) and missing parents are created.
#
# The `value` sub-dict is written as well as `enabled`, exactly as the old plist
# blob did: it keeps the binding itself intact (standard, Cmd-Space) while
# disabled, so toggling Spotlight back on in System Settings restores Cmd-Space
# rather than an unbound entry.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "value", "type"]
value = "standard"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "value", "parameters"]
value = [32, 49, 1048576]

# Battery percentage in the menu bar is a per-host preference — the scalar table
# above has no way to say `defaults -currentHost`, which is why this one entry
# needed the hook. (The Bluetooth item next to it is not ByHost; it stays above.)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
value = true
host = "current"
