# KDE Plasma settings for the CachyOS desktop — the counterpart to
# conf.d/macos-defaults.toml and conf.d/xfce.neko.toml.
#
# Only keys that differ from what CachyOS ships. Theme (BreezeDark), icons,
# cursor (capitaine-cursors) and AnimationDurationFactor=0.25 all come from
# cachyos-kde-settings' /etc/skel, so they are NOT repeated here.
#
# kwriteconfig6 writes single keys into ~/.config/*rc and leaves the rest of the
# file alone — which is why these are not [dotfiles]: Plasma rewrites these files
# constantly (session state, UUID-keyed tiling layouts, kconf_update markers), and
# Claude Code adds its own URL handler to mimeapps.list. Unlike xfconf-query it
# needs no D-Bus session, so this works from ssh too; Plasma picks the values up
# at the next login.

[tasks."cachyos:kde"]
description = "Apply KDE Plasma settings (kwriteconfig6) on the CachyOS desktop"
run = '''
set -u
command -v kwriteconfig6 >/dev/null 2>&1 || { echo "[skip] kwriteconfig6 not installed"; exit 0; }

k() { kwriteconfig6 "$@" || echo "[warn] kwriteconfig6 $*"; }

# ── Keyboard ───────────────────────────────────────────────────────────────
# Mac-style modifiers: swap Left Alt / Left Ctrl / Left Win so Cmd-position
# shortcuts land where the Macs have them.
k --file kxkbrc --group Layout --key Options "ctrl:swap_lalt_lctl_lwin"
k --file kxkbrc --group Layout --key ResetOldOptions true

# Natural scrolling on the Telink wireless keyboard's touchpad (the group is
# libinput's vendor/product id pair, so it only matches that device).
k --file kcminputrc --group Libinput --group 12815 --group 20616 \
  --group "Telink Wireless Gaming Keyboard" --key NaturalScroll true

# ── Default browser ────────────────────────────────────────────────────────
# zen.desktop is the one zen-browser-bin installs. (The machine used to point at
# a KDE-generated userapp-Zen-*.desktop wrapper; same binary, but that file is not
# reproducible.)
for t in x-scheme-handler/http x-scheme-handler/https x-scheme-handler/chrome \
  text/html application/xhtml+xml application/x-extension-htm \
  application/x-extension-html application/x-extension-shtml \
  application/x-extension-xhtml application/x-extension-xht; do
  k --file mimeapps.list --group "Default Applications" --key "$t" zen.desktop
done

echo "[ok] kde settings applied"
'''
