# The CachyOS desktop (class `cachyos`): KDE Plasma, fish, NVIDIA 2080 Ti, a
# Dell on DP-1 and a BenQ projector on HDMI-A-1. A real systemd box, so apps
# are pacman packages. Scope is only what was added after the installer (see
# /var/log/pacman.log); theme, cursor and the fish prompt are CachyOS's own.

# ── Tools ───────────────────────────────────────────────────────────────────
[tools]
# Pre-releases only, so `latest` finds nothing: pinned. `bin` names the AppImage.
"github:rommapp/ludo" = { version = "1.0.0-beta.9", bin = "ludo", os = "linux" }
# The KDE build can see the focused window on Wayland.
"github:xremap/xremap" = { version = "latest", asset_pattern = "xremap-linux-x86_64-kde.zip", bin = "xremap", os = "linux" }

[env]
EDITOR = "micro"   # no VS Code here

[shell_alias]
ef = "exec fish"

# ── System packages ─────────────────────────────────────────────────────────
[bootstrap.packages]
"pacman:zen-browser-bin" = "latest"              # cachyos repo; default browser (cachyos:kde)
"pacman:cachyos-gaming-meta" = "latest"          # wine/proton deps, lib32 drivers
"pacman:cachyos-gaming-applications" = "latest"  # steam, lutris, heroic, mangohud, gamescope
"pacman:gamescope-session-cachyos" = "latest"    # the Steam Big Picture login session
"pacman:ghostty" = "latest"
"pacman:flatpak" = "latest"
"pacman:xbindkeys" = "latest"                    # Ctrl+Alt+D out of Big Picture
"pacman:jq" = "latest"                           # the Decky installer needs it
# A system flatpak; Arch's flatpak already ships the flathub remote.
"flatpak:net.retrodeck.retrodeck" = "latest"

# Nothing orders pacman entries before the flatpak: one.
[bootstrap.hooks.pre-packages]
run = '''
[ -f /etc/arch-release ] || exit 0
command -v flatpak >/dev/null 2>&1 || sudo pacman -S --needed --noconfirm flatpak
'''

# ── Services & firewall ─────────────────────────────────────────────────────
# Shipped but not enabled by default.
[bootstrap.services.sshd]
state = "running"
enabled = true

# CachyOS's ufw denies all inbound with no allow rules, so clients time out.
[bootstrap.linux.firewall]
backend = "ufw"
state = "enabled"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "home-lan"
source = "192.168.18.0/24"
action = "allow"

# ── Dotfiles ────────────────────────────────────────────────────────────────
[dotfiles]
"~/.config/fish/config.fish" = { source = "fish/config.fish", mode = "symlink" }
# Big Picture on the projector: pin the session to HDMI-A-1 and force SDR
# Rec.709/D65 (its EDID claims HDR the 2080 Ti can't drive at 4K60, and a
# bogus white point). Write-up: ~/gamescope-projector-setup.md on the box.
"~/.config/systemd/user/gamescope-session.service.d/projector.conf" = { source = "systemd/gamescope-projector.conf", mode = "symlink" }
"~/.config/gamescope/scripts/benq-projector.lua"                     = { source = "gamescope/benq-projector.lua", mode = "symlink" }
# template: .desktop files don't expand `~`.
"~/.local/share/applications/ludo.desktop" = { source = "applications/ludo.desktop.tmpl", mode = "template" }
"~/.config/xremap/config.yml"   = { source = "xremap/config.yml", mode = "symlink" }
"~/.config/xbindkeys/gamescope" = { source = "gamescope/xbindkeysrc", mode = "symlink" }

# systemd only notices a new or changed drop-in after a reload.
[bootstrap.hooks.post-dotfiles]
run = '''
command -v systemctl >/dev/null 2>&1 || exit 0
systemctl --user daemon-reload 2>/dev/null || true
'''

# ── macOS keyboard: xremap ──────────────────────────────────────────────────
# Tag only the Rainy 75's nodes `uaccess` (an ACL for the seat user) rather than
# joining `input`, which would expose every input device. Numbered below 73 so
# systemd's seat rules see the tag.
[bootstrap.files."/etc/udev/rules.d/70-xremap-rainy75.rules"]
content = """SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="Telink Wireless Gaming Keyboard", TAG+="uaccess"
"""
owner = "root"
group = "root"
mode = "0644"

# Plasma session only, so Big Picture gets a plain keyboard. Fails until the
# tools phase installs xremap and cachyos:xremap-acl lands; Restart= retries.
[bootstrap.linux.systemd.units.xremap]
description = "xremap: macOS modifiers and shortcuts on the Rainy 75"
exec_start = '%h/.local/share/mise/shims/xremap --watch=device,config --device "Telink Wireless Gaming Keyboard" %h/.config/xremap/config.yml'
part_of = ["plasma-workspace.target"]
after = ["plasma-workspace.target"]
wanted_by = ["plasma-workspace.target"]
restart = "always"
restart_sec = "3s"

# ── Boot into Big Picture ───────────────────────────────────────────────────
# gamescope-session-cachyos's steam-set-session already resets Session= to
# gamescope at every Plasma login; it only lacked a User=. Relogin=false: one
# autologin per boot, so leaving Big Picture lands on the password prompt (and
# unlocks KWallet). The couch is guarded by Steam's own lock-screen PIN.
[bootstrap.files."/etc/plasmalogin.conf.d/50-autologin-user.conf"]
content = """[Autologin]
User=hugo
Relogin=false
"""
owner = "root"
group = "root"
mode = "0644"

# Ctrl+Alt+D back to the desktop (a black screen when the projector is off).
# Not the package's gamescope-xbindkeys, which wants a root-owned /etc/xbindkeysrc.
[bootstrap.linux.systemd.units.gamescope-keys]
description = "Ctrl+Alt+D: leave Big Picture for the desktop"
exec_start = "/usr/bin/xbindkeys -n -f %h/.config/xbindkeys/gamescope"
environment_file = ["%t/gamescope-environment"]
part_of = ["gamescope-session.target"]
after = ["gamescope-session.target"]
wanted_by = ["gamescope-session.target"]
restart = "on-failure"
restart_sec = "3s"

# ── Tasks (bodies in tasks/) ────────────────────────────────────────────────
# The last step of `mise bootstrap`. Sequential: two of these may ask for sudo.
[tasks.bootstrap]
run = [
  { task = "cachyos:kde" },
  { task = "cachyos:kwin-switcher" },
  { task = "cachyos:decky" },
  { task = "cachyos:xremap-acl" },
]

[tasks."cachyos:kde"]
description = "Apply KDE Plasma settings (kwriteconfig6)"
skip_if = "! command -v kwriteconfig6 >/dev/null 2>&1"
run = "sh tasks/kde.sh"

[tasks."cachyos:kwin-switcher"]
description = "Cmd+Tab / Cmd+` for KWin's window switchers (needs the Plasma session)"
skip_if = "! command -v gdbus >/dev/null 2>&1"
run = "sh tasks/kwin-switcher.sh"

[tasks."cachyos:decky"]
description = "Install Decky Loader (needs Steam to have run once)"
hide = true
skip_if = 'test -x "$HOME/homebrew/services/PluginLoader"'
run = "sh tasks/decky.sh"

[tasks."cachyos:xremap-acl"]
description = "Re-trigger udev so the Rainy 75 gets this user's ACL"
hide = true
run = "sh tasks/xremap-acl.sh"

# ── Doctor checks ───────────────────────────────────────────────────────────
[doctor.checks.gamescope-projector]
description = "the gamescope session still reads OUTPUT_CONNECTOR"
hint = "a gamescope-session-cachyos update renamed it — grep /usr/lib/steamos/gamescope-session and update conf.d/cachyos/systemd/gamescope-projector.conf"
run = '''
f=/usr/lib/steamos/gamescope-session
[ -f "$f" ] || { echo "$f missing — is gamescope-session-cachyos installed?"; exit 1; }
grep -q OUTPUT_CONNECTOR "$f" || { echo "$f no longer mentions OUTPUT_CONNECTOR"; exit 1; }
'''
