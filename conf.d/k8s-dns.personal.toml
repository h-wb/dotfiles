# ── k8s-gateway DNS: one zone, two clusters, pick one ───────────────────────
#
# Both clusters run k8s-gateway AUTHORITATIVE for the same internal zone, with no
# `fallthrough` in either Corefile. So whichever one answers returns an
# authoritative NXDOMAIN for a route that only exists on the other, and
# mDNSResponder stops there — a second `nameserver` line in the resolver file buys
# nothing. One zone, one gateway, pick it:
#
#   mise run dns:edge     mise run dns:main     mise run dns:status
#
# The whole feature is this file plus home/k8s-dns/resolver.tmpl. `.personal.toml`
# is the scope: /etc/resolver is a macOS mechanism and `[bootstrap.files]` accepts
# no `os` key, so the env suffix is the only filter available. The container never
# loads this file — the Darwin guards below are for a stray MISE_ENV=personal.

# ── Values ──────────────────────────────────────────────────────────────────
# k8s_dns_cluster is the selection, with three sources, lowest priority first:
#   1. "main" — the default here.
#   2. $K8S_DNS_CLUSTER — an ad-hoc override for one command; what CI drives.
#   3. [vars] in the untracked mise.local.toml — the PERSISTENT choice, written by
#      `dns:select`. Local beats everything (gotcha #11), so a machine parked on
#      edge stays there across `mise run apply`.
#
# The gateway IPs stay fnox secrets: this repo is public and they are internal
# addresses. An absent secret renders an empty file rather than failing, which
# `dns:apply` keys off. The ZONE is not a secret — it could not be, since the
# `[bootstrap.files]` key below cannot be templated.
[vars]
k8s_dns_cluster     = "{{ get_env(name='K8S_DNS_CLUSTER', default='main') }}"
k8s_dns_zone        = "wlab.ovh"
k8s_dns_source      = "{{ env.HOME }}/.config/k8s-dns/resolver"
k8s_gateway_ip_main = "{{ get_env(name='K8S_GATEWAY_IP_MAIN', default='') }}"
k8s_gateway_ip_edge = "{{ get_env(name='K8S_GATEWAY_IP_EDGE', default='') }}"

# ── The two files ───────────────────────────────────────────────────────────
# `source` is NOT templated and resolves relative to THE CONFIG FILE'S directory
# (gotcha #2) — for a fragment that is ~/.config/mise/conf.d, not the repo root.
# `../home/...` is the fix and it is not a hack: conf.d is a symlink into the repo,
# so the kernel follows it and `..` lands on the repo root. (Verified 2026-09-27;
# a bare `home/...` looked for ~/.config/mise/conf.d/home/..., and `~/...` is not
# expanded for a [dotfiles] source at all.)
[dotfiles]
"~/.config/k8s-dns/resolver" = { source = "../home/k8s-dns/resolver.tmpl", mode = "template" }

# mise does the privileged write; [dotfiles] cannot (it applies as the invoking
# user and never sudos, so a /etc/resolver target dies with Permission denied).
# This is bootstrap phase 3, and `source` DOES honour `~`/$HOME here.
#
# Both literals below duplicate a [vars] value, because neither a [bootstrap.files]
# key nor its `source` is templated. `dns:check` asserts they match, so the
# duplication cannot drift silently.
[bootstrap.files."/etc/resolver/wlab.ovh"]
source = "~/.config/k8s-dns/resolver"
owner = "root"
group = "wheel"
mode = "0644"

# ── Tasks ───────────────────────────────────────────────────────────────────
# Two thin entry points over one implementation. They pass the cluster in an ENV
# VAR rather than as an argument because `mise run dns:select -- edge` appends the
# arg to the LAST LINE of the run script instead of making it $1.
[tasks."dns:main"]
description = "Resolve the internal zone via the main cluster's k8s-gateway"
run = "K8S_DNS_CLUSTER=main mise run dns:select"

[tasks."dns:edge"]
description = "Resolve the internal zone via the edge cluster's k8s-gateway"
run = "K8S_DNS_CLUSTER=edge mise run dns:select"

# Persist the choice, re-render, install, flush.
#
# The `unset` matters: K8S_DNS_CLUSTER is also a var source (#2 above), so leaving
# it set would make the re-render pick the right IP even if the write to
# mise.local.toml had silently failed — the switch would look like it worked and
# then revert on the next apply. Unsetting it forces the render to prove the
# persisted value is what gets read.
#
# Flushing is not optional: without it the resolver file is already correct and
# every lookup still returns the old answer, which reads exactly like the switch
# not working.
[tasks."dns:select"]
description = "(internal) persist $K8S_DNS_CLUSTER, re-render, install, flush"
dir = "{{ env.HOME }}/.dotfiles"
run = '''
case "${K8S_DNS_CLUSTER:-}" in
main | edge) want="$K8S_DNS_CLUSTER" ;;
*) echo "set K8S_DNS_CLUSTER=main|edge (or use dns:main / dns:edge)" >&2; exit 1 ;;
esac

f=mise.local.toml
[ -f "$f" ] || printf '# Per-machine, untracked (gitignored). mise loads this automatically.\n[vars]\n' >"$f"
grep -q '^\[vars\]' "$f" || printf '\n[vars]\n' >>"$f"
if grep -q '^k8s_dns_cluster *=' "$f"; then
	sed -i '' -E "s/^k8s_dns_cluster *=.*/k8s_dns_cluster = \"$want\"/" "$f"
else
	sed -i '' -E "s/^(\[vars\])\$/\\1\\nk8s_dns_cluster = \"$want\"/" "$f"
fi

unset K8S_DNS_CLUSTER
./scripts/pass-preflight || exit 1
fnox --if-missing error exec -c fnox.toml -- mise bootstrap --only dotfiles --yes
mise run dns:apply
sudo dscacheutil -flushcache
sudo killall -HUP mDNSResponder
mise run dns:status
'''

# The privileged write, deliberately split out of the main bootstrap.
#
# [bootstrap.files] is phase 3 but the source it reads is rendered by [dotfiles]
# in phase 4, and a missing source is FATAL to the whole bootstrap (verified
# 2026-09-27: exit 1, and the dotfiles phase never ran at all — a fresh Mac would
# abort before provisioning anything). Same shape as the [bootstrap.secrets] trap
# this repo already rejected. So `[tasks.apply]` and install.sh run
# `mise bootstrap --skip files` and then call this.
#
# The guard is the repo's silent-overwrite rule applied to /etc/resolver: the
# template renders nothing when the chosen cluster has no IP, and a
# nameserver-less resolver file would break the zone as thoroughly as a wrong IP.
# It greps for the directive rather than testing `-s`, because "non-empty" is the
# wrong question — a template that emitted only a stray newline once passed `-s`
# and would have installed a resolver file with no nameserver in it.
[tasks."dns:apply"]
description = "Install /etc/resolver for the selected cluster (needs sudo)"
run = '''
[ "$(uname)" = "Darwin" ] || exit 0
if grep -q '^nameserver ' "{{ vars.k8s_dns_source }}" 2>/dev/null; then
	mise bootstrap files apply --yes
else
	echo "[dns] {{ vars.k8s_dns_source }} has no nameserver line — leaving /etc/resolver alone"
fi
'''

# `selected` is the var mise actually resolved, not a re-read of one file, so it
# reflects whichever of the three sources won.
[tasks."dns:status"]
description = "Show which cluster resolves the internal zone"
run = '''
zone="{{ vars.k8s_dns_zone }}"
src="{{ vars.k8s_dns_source }}"
echo "selected: {{ vars.k8s_dns_cluster }}"
echo "zone:     $zone"
echo "rendered: $(grep -q '^nameserver ' "$src" 2>/dev/null && cat "$src" || echo '<no nameserver line>')"
echo "resolver: $([ -f "/etc/resolver/$zone" ] && cat "/etc/resolver/$zone" || echo '<not installed>')"
echo "lookup:   k8s-gateway.network.$zone ->$(dscacheutil -q host -a name "k8s-gateway.network.$zone" | awk '/^ip_address:/ { printf " %s", $2 }')"
echo
echo "switch:   mise run dns:main | mise run dns:edge"
'''

# The body of [doctor.checks.k8s-dns]. It lives in a TASK because a doctor check's
# `run` is NOT templated (verified 2026-09-27: the literal `{{ ... }}` reaches the
# shell), while a task's is — so only from here can the zone and source paths come
# from [vars] instead of being spelled out a third and fourth time.
[tasks."dns:check"]
description = "(internal) assert the resolver matches the rendered selection"
dir = "{{ env.HOME }}/.dotfiles"
run = '''
[ "$(uname)" = "Darwin" ] || exit 0
zone="{{ vars.k8s_dns_zone }}"
src="{{ vars.k8s_dns_source }}"
frag=conf.d/k8s-dns.personal.toml
rc=0

# The two literals that cannot be templated must still agree with [vars].
grep -qF "[bootstrap.files.\"/etc/resolver/$zone\"]" "$frag" ||
	{ echo "$frag: [bootstrap.files] key does not match vars.k8s_dns_zone ($zone)"; rc=1; }
grep -qF "source = \"~/${src#"$HOME/"}\"" "$frag" ||
	{ echo "$frag: [bootstrap.files] source does not match vars.k8s_dns_source ($src)"; rc=1; }

# A source with no nameserver line is the no-secrets state, which deliberately
# leaves /etc/resolver alone — not a failure.
if grep -q '^nameserver ' "$src" 2>/dev/null; then
	if [ ! -f "/etc/resolver/$zone" ]; then
		echo "/etc/resolver/$zone is missing but the rendered selection is $(cat "$src")"
		rc=1
	elif ! cmp -s "$src" "/etc/resolver/$zone"; then
		echo "/etc/resolver/$zone is '$(cat "/etc/resolver/$zone")', rendered selection is '$(cat "$src")'"
		rc=1
	fi
fi
exit $rc
'''

# ── Doctor ──────────────────────────────────────────────────────────────────
# The invariant that broke: the resolver used to be written inline by
# [tasks.bootstrap] from a single hardcoded gateway IP, so every `mise run apply`
# silently reverted a switch. The selection persists now, but the two-step
# (--skip files, then dns:apply) means a switch can still half-land if the
# privileged write is declined — rendered source and /etc/resolver then disagree,
# and DNS answers come from a cluster the config no longer claims.
[doctor.checks.k8s-dns]
description = "/etc/resolver matches the rendered k8s-gateway selection"
hint = "run `mise run dns:apply` (or dns:main / dns:edge to re-pick)"
run = "mise run dns:check"
