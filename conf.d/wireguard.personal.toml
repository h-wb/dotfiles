# Keeps the `home` WireGuard tunnel connected.
#
# The cluster talks to LM Studio on this machine over that tunnel (see home-ops
# kubernetes/apps/main/llm/litellm/app/models/local.yaml, which points at
# 192.168.27.65 — an address that only exists while the tunnel is up). WireGuard.app
# neither auto-connects nor runs at login, so document OCR and AI suggestions stall
# after a reboot until the tunnel is started by hand.
#
# LM Studio itself needs nothing here: it is already a login item and
# ~/.lmstudio/.internal/http-server-config.json has autoStartOnLaunch = true, so the
# API server comes up with the app.
#
# The work is in home/bin/wireguard-autoconnect because mise passes agent args
# through without templating and rejects Label/Standard*Path (same shape as the
# pass-cli-ssh-agent in mise.toml). No fnox wrapper: scutil needs no secrets, and
# starting a tunnel the user already installed needs no privileges.
[bootstrap.macos.launchd.agents.wireguard-autoconnect]
program = "/bin/sh"
args = [
  "-c",
  'exec "$HOME/.local/bin/wireguard-autoconnect" >> "$HOME/Library/Logs/wireguard-autoconnect.log" 2>&1',
]
run_at_load = true
keep_alive = true
