# The MCP servers every agent connects to, on every machine (README.md).

[vars]
claude_scope = "general"
codex_scope = "general"
vibe_scope = "private"
chrome_cdp_url = ""
# General memory as a second, read-only server; set where a private machine has a key for it.
memini_general_ro_url = ""

[env]
CLAUDE_CONFIG_DIR = "{{ env.HOME }}/.claude"

[dotfiles]
"~/.claude/.claude.json/mcp" = { source = "config/claude.json", merge = true, template = "tera" }
"~/.codex/config.toml/mcp" = { source = "config/codex.toml", merge = true, template = "tera" }
"~/.vibe/config.toml/mcp" = { source = "config/vibe.toml", merge = true, template = "tera" }
# The skills every machine declares, from the h-wb/skills submodule (README.md):
# one entry per skill and folder. Claude Code reads ~/.claude/skills; Codex,
# OpenCode and Vibe ~/.agents/skills. symlink-each links the skill's files and
# leaves what others keep there alone (the pods' own from conf.d/paseo, Paseo's,
# Claude's `synced`).
"~/.claude/skills/board" = { source = "../../vendor/skills/skills/board", mode = "symlink-each" }
"~/.claude/skills/handbook" = { source = "../../vendor/skills/skills/handbook", mode = "symlink-each" }
"~/.claude/skills/tool-gateway" = { source = "../../vendor/skills/skills/tool-gateway", mode = "symlink-each" }
"~/.agents/skills/board" = { source = "../../vendor/skills/skills/board", mode = "symlink-each" }
"~/.agents/skills/handbook" = { source = "../../vendor/skills/skills/handbook", mode = "symlink-each" }
"~/.agents/skills/tool-gateway" = { source = "../../vendor/skills/skills/tool-gateway", mode = "symlink-each" }

# The catalogue follows h-wb/skills' main: a merged skill reaches every machine at
# its next apply and every pod at its next start, with nothing to bump here. A
# clone, `mise bootstrap --from` included, leaves a submodule empty, so this runs
# before the links are made. Offline, it keeps the commit it has, or the one
# recorded here. Only a checkout has a submodule (the tests copy the tree).
[bootstrap.hooks.pre-dotfiles]
description = "Bring the skills catalogue to h-wb/skills main"
run = '''
[ -e "{{ vars.repo }}/.git" ] || exit 0
git -C "{{ vars.repo }}" submodule update --init --remote vendor/skills \
  || git -C "{{ vars.repo }}" submodule update --init vendor/skills
'''
