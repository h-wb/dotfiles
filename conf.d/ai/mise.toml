# The MCP servers every agent connects to, on every machine (README.md).

[vars]
claude_scope = "general"
codex_scope = "general"
vibe_scope = "private"
chrome_cdp_url = ""
# General memory as a second, read-only server; set where a private machine has a key for it.
memini_general_ro_url = ""

[env]
CLAUDE_CONFIG_DIR = "{{ env.HOME }}/.claude"

[dotfiles]
"~/.claude/.claude.json/mcp" = { source = "config/claude.json", merge = true, template = "tera" }
"~/.codex/config.toml/mcp" = { source = "config/codex.toml", merge = true, template = "tera" }
"~/.vibe/config.toml/mcp" = { source = "config/vibe.toml", merge = true, template = "tera" }
# The shared skills (README.md): Claude Code reads the first folder; Codex, OpenCode
# and Vibe the second. symlink-each links our files and leaves what others keep
# there alone (Paseo's own skills, Claude's `synced`).
"~/.claude/skills" = { source = "skills", mode = "symlink-each" }
"~/.agents/skills" = { source = "skills", mode = "symlink-each" }
