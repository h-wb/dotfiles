# The MCP servers every agent connects to, on every machine (README.md).

[vars]
claude_scope = "general"
codex_scope = "general"
vibe_scope = "private"
chrome_cdp_url = ""
# General memory as a second, read-only server; set where a private machine has a key for it.
memini_general_ro_url = ""

[env]
CLAUDE_CONFIG_DIR = "{{ env.HOME }}/.claude"

[dotfiles]
"~/.claude/.claude.json/mcp" = { source = "config/claude.json", merge = true, template = "tera" }
"~/.codex/config.toml/mcp" = { source = "config/codex.toml", merge = true, template = "tera" }
"~/.vibe/config.toml/mcp" = { source = "config/vibe.toml", merge = true, template = "tera" }
"~/.claude/skills/*" = { source = "../../vendor/skills/groups/core/*", mode = "symlink" }
"~/.agents/skills/*" = { source = "../../vendor/skills/groups/core/*", mode = "symlink" }

[bootstrap.hooks.pre-dotfiles]
description = "Bring the skills to h-wb/skills main and drop broken skill links"
run = '''
[ -e "{{ vars.repo }}/.git" ] && { git -C "{{ vars.repo }}" submodule update --init --remote vendor/skills || git -C "{{ vars.repo }}" submodule update --init vendor/skills; }
find -L ~/.claude/skills ~/.agents/skills -mindepth 1 -maxdepth 1 -type l -exec rm -f {} + 2>/dev/null || true
'''
