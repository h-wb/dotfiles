# Layer `fish`: the shell of the machines that use fish (neko, cachyos,
# code-server), and its starship prompt. A machine's own lines go in
# conf.d/<machine>/fish/<machine>.fish, linked into ~/.config/fish/conf.d/.
# The fish binary is not here: each machine gets it its own way.

[tools]
starship = "latest"

[shell_alias]
ef = "exec fish"

[dotfiles]
"~/.config/fish/config.fish" = { source = "config.fish", mode = "symlink" }
"~/.config/starship.toml"    = { source = "starship.toml", mode = "symlink" }
