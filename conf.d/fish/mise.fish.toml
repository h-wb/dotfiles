# Layer `fish`: config.fish and starship, not the binary. A machine's own lines
# go in conf.d/<machine>/fish/<machine>.fish.

[tools]
starship = "latest"

[shell_alias]
ef = "exec fish"

[dotfiles]
"~/.config/fish/config.fish" = { source = "config.fish", mode = "symlink" }
"~/.config/starship.toml"    = { source = "starship.toml", mode = "symlink" }
