# Anki in neko, kept running for n8n's AnkiConnect calls on :8765 and ToolHive's
# AnkiMCP calls on :3141 (home-ops has both Services). The AnkiWeb login is the
# one manual step.

[tools."http:anki"]
os = "linux"
version = "26.09.3"
strip_components = 1
bin_path = "."                    # else mise shims the tarball's bundled python instead of `anki`
[tools."http:anki".platforms]
linux-x64 = { url = "https://github.com/ankitects/anki/releases/download/26.09.3/anki-26.09.3-linux-x86_64.tar.zst" }
linux-arm64 = { url = "https://github.com/ankitects/anki/releases/download/26.09.3/anki-26.09.3-linux-aarch64.tar.zst" }

# The add-on (AnkiWeb id 2055492159); anki:addon links it into Anki.
[tools."http:anki-connect"]
os = "linux"
version = "25.9.6.0"
strip_components = 1
url = "https://git.sr.ht/~foosoft/anki-connect/archive/25.9.6.0.tar.gz"

# The MCP server add-on (AnkiWeb id 124672614), Python deps vendored. Beta:
# read the release notes before a bump, tools get renamed.
[tools."http:anki-mcp-server"]
os = "linux"
version = "0.40.0"
format = "zip"                    # a .ankiaddon is a zip; mise keeps it packed otherwise
url = "https://github.com/ankimcp/anki-mcp-server-addon/releases/download/v0.40.0/anki_mcp_server.ankiaddon"

# Qt 6 xcb platform plugin
[bootstrap.packages]
"apt:libxcb-cursor0" = "latest"
"apt:libxcb-icccm4" = "latest"
"apt:libxcb-image0" = "latest"
"apt:libxcb-keysyms1" = "latest"
"apt:libxcb-render-util0" = "latest"

# No systemd here: the image's supervisord keeps Anki up (anki:start loads this).
[bootstrap.files."/etc/neko/supervisord/anki.conf"]
owner = "root"
group = "root"
mode = "0644"
content = '''
[program:anki]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/home/%(ENV_USER)s/.local/bin/anki-session
stopsignal=INT
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/anki.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
'''

[dotfiles]
"~/.local/bin/anki-session" = { source = "bin/anki-session", mode = "symlink" }
"~/.local/share/applications/anki.desktop" = { source = "anki.desktop.tmpl", mode = "template" }

# Run by conf.d/neko's `bootstrap` task.
[tasks."anki:setup"]
description = "Link AnkiConnect and AnkiMCP into Anki, write their config, start Anki under supervisord"
run = [{ task = "anki:addon" }, { task = "anki:start" }]

[tasks."anki:addon"]
description = "Link the AnkiConnect and AnkiMCP add-ons and write their config"
hide = true
skip_if = '! "$HOME/.local/bin/mise" where http:anki-connect >/dev/null 2>&1'
run = "sh tasks/addon.sh"

# Starts Anki on a rolled pod; a no-op when anki.conf is unchanged.
[tasks."anki:start"]
description = "Load anki.conf into supervisord"
hide = true
skip_if = "[ ! -f /etc/neko/supervisord/anki.conf ]"
run = "sudo supervisorctl -c /etc/neko/supervisord.conf update anki"

[doctor.checks.anki-connect]
description = "Anki is running and AnkiConnect answers"
hint = "sudo supervisorctl -c /etc/neko/supervisord.conf status anki; see ~/.local/state/anki-session.log"
run = '''
curl -fsS -m 3 -X POST http://127.0.0.1:8765 -d '{"action":"version","version":6}' >/dev/null ||
  { echo "nothing on 127.0.0.1:8765 — Anki is closed, or the add-on did not load"; exit 1; }
'''

# Any HTTP answer will do: with the key set, an unauthenticated request is a 403.
[doctor.checks.anki-mcp]
description = "AnkiMCP answers on :3141"
hint = "Tools → Add-ons in Anki shows load errors; its first start fetches pydantic_core from PyPI"
depends = ["anki-connect"]
run = '''
curl -sS -m 3 -o /dev/null http://127.0.0.1:3141/ ||
  { echo "nothing on 127.0.0.1:3141 — the AnkiMCP add-on did not load"; exit 1; }
'''
