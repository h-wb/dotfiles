# Anki in the neko desktop, kept running so n8n can reach AnkiConnect on :8765
# (home-ops has the Service). The AnkiWeb login is the one manual step.

[tools."http:anki"]
os = "linux"
version = "26.09.3"
strip_components = 1
bin_path = "."                    # else mise shims the tarball's bundled python instead of `anki`
[tools."http:anki".platforms]
linux-x64 = { url = "https://github.com/ankitects/anki/releases/download/26.09.3/anki-26.09.3-linux-x86_64.tar.zst" }
linux-arm64 = { url = "https://github.com/ankitects/anki/releases/download/26.09.3/anki-26.09.3-linux-aarch64.tar.zst" }

# The add-on (AnkiWeb id 2055492159); setup.sh links it into Anki.
[tools."http:anki-connect"]
os = "linux"
version = "25.9.6.0"
strip_components = 1
url = "https://git.sr.ht/~foosoft/anki-connect/archive/25.9.6.0.tar.gz"

# Qt 6 xcb platform plugin
[bootstrap.packages]
"apt:libxcb-cursor0" = "latest"
"apt:libxcb-icccm4" = "latest"
"apt:libxcb-image0" = "latest"
"apt:libxcb-keysyms1" = "latest"
"apt:libxcb-render-util0" = "latest"

# No systemd here, so [bootstrap.services] is out: the image's supervisord
# keeps Anki up. setup.sh loads this file.
[bootstrap.files."/etc/neko/supervisord/anki.conf"]
owner = "root"
group = "root"
mode = "0644"
content = '''
[program:anki]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/home/%(ENV_USER)s/.local/bin/anki-session
stopsignal=INT
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/anki.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
'''

[dotfiles]
"~/.local/bin/anki-session" = { source = "bin/anki-session", mode = "symlink" }
"~/.local/share/applications/anki.desktop" = { source = "anki.desktop.tmpl", mode = "template" }

# A dependency of conf.d/neko's `bootstrap` task.
[tasks."anki:setup"]
description = "Link AnkiConnect into Anki, write its config, start Anki under supervisord"
run = "sh setup.sh"

[doctor.checks.anki-connect]
description = "Anki is running and AnkiConnect answers"
hint = "sudo supervisorctl -c /etc/neko/supervisord.conf status anki; see ~/.local/state/anki-session.log"
run = '''
curl -fsS -m 3 -X POST http://127.0.0.1:8765 -d '{"action":"version","version":6}' >/dev/null ||
  { echo "nothing on 127.0.0.1:8765 — Anki is closed, or the add-on did not load"; exit 1; }
'''
