#
# This ran a Prefect worker for the `macbook-pool` process pool so cluster-scheduled
# flows could execute against LM Studio on this machine. That indirection turned out
# to be unnecessary: paperless-gpt talks to LM Studio directly over the WireGuard
# tunnel (see home-ops kubernetes/apps/main/llm/lmstudio), so nothing needs a worker
# here. Prefect is a job scheduler, not a synchronous inference gateway.
#
# To re-enable: uncomment everything below, run `mise bootstrap`, and recreate the
# work pool with `prefect worker start --pool macbook-pool --type process`.
# home/bin/prefect-worker-start is left in place and is still correct.

# Prefect worker for the `macbook-pool` process pool. Flows run as local
# subprocesses here rather than in the cluster, so they can reach the inference
# server on 127.0.0.1:1234 (LM Studio, later mlx-vlm) — which also means this
# can't be a container: Docker on macOS has no Metal access and its localhost
# isn't the host's.
#
# Secrets (PREFECT_API_URL, PREFECT_API_AUTH_STRING) come from fnox.toml.

# [tools]
# uv = "latest"                             # worker venv + the `uv pip install .` pull step

# Wrapped in `fnox exec` so the API URL and auth string are resolved at runtime
# from ProtonPass rather than baked into the plist. env vars and logging are
# folded into the sh -c string because mise rejects Label/EnvironmentVariables/
# Standard*Path (same shape as the pass-cli-ssh-agent in mise.toml).
#
# The venv env, the /api normalisation of PREFECT_API_URL and the --type flag all
# live in home/bin/prefect-worker-start now; launchd only wraps it in fnox.
# PATH must still be set out here, BEFORE fnox: fnox shells out to `pass-cli` to
# resolve the ProtonPass refs, and launchd's default PATH has no mise shims, so
# without this every secret fails with "CLI tool 'pass-cli' not found".
# [bootstrap.macos.launchd.agents.prefect-worker]
# program = "/bin/sh"
# args = [
#   "-c",
#   'exec env PATH="$HOME/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin" "$("$HOME/.local/bin/mise" which fnox)" exec -c "$HOME/.dotfiles/fnox.toml" -- "$HOME/.local/bin/prefect-worker-start" >> "$HOME/Library/Logs/prefect-worker.log" 2>&1',
# ]
# run_at_load = true
# keep_alive = true

# Runs at the very end of `mise bootstrap`, after [tools] is installed so uv
# exists. Note launchd-agents apply (step 11) loads the agent *before* this, so
# on a first bootstrap the worker crash-loops until the venv appears — keep_alive
# picks it up on the next retry.
#
# Pinned to python 3.12: the global pin is 3.14, which prefect 3.6.7 doesn't
# support. Prefect is pinned to the version the cluster server runs so the
# client and server stay in step.
