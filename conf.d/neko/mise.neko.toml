# The neko/xfce container (class `neko`): ghcr.io/m1k1o/neko/xfce in k8s, Debian
# trixie, user `neko`, passwordless sudo, supervisord as pid 1 (no systemd).
# Only /home/neko is on a PVC; /usr and /etc are wiped every pod roll, so apt
# stays tiny and bin/neko-bootstrap re-runs bootstrap at every session start.

# ── Tools, including the GUI apps ───────────────────────────────────────────
# Not brew, apt or flatpak: they install outside the PVC, or (flatpak) need a
# user namespace. `http:` entries are pinned: bump the version and both URLs,
# then `mise lock --global`. os = "linux" so a stray `-E neko` on a Mac fails clean.
# Adding an app: a [tools] entry, a .desktop in xfce/applications/ and its
# [dotfiles] line (Exec is the shim, stable across bumps).
[tools]
starship = "latest"
"github:zen-browser/desktop" = { version = "latest", os = "linux" }   # whole archive; zen at its root

[tools."http:vscode"]
os = "linux"
version = "1.136.1"
strip_components = 1
bin_path = "bin"                  # bin/code, next to a bin/ dir of helpers
[tools."http:vscode".platforms]
linux-x64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-x64/stable" }
linux-arm64 = { url = "https://update.code.visualstudio.com/1.136.1/linux-arm64/stable" }

[env]
TZ = "America/New_York"              # also what neko:tz links /etc/localtime to
# seccomp blocks the kernel keyring pass-cli uses by default; `fs` keeps the key on the PVC.
PROTON_PASS_KEY_PROVIDER = "fs"

[shell_alias]
ef = "exec fish"

# ── System packages (reinstalled every pod start: keep it short) ────────────
[bootstrap.packages]
"apt:git" = "latest"
"apt:fish" = "latest"
"apt:less" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:xdg-utils" = "latest"
"apt:fontconfig" = "latest"  # fc-cache, for neko:fonts
# Libraries the base image lacks, for the GUI apps.
"apt:libnss3" = "latest"          # Electron (VS Code, Obsidian)
"apt:libnspr4" = "latest"
"apt:libasound2t64" = "latest"
"apt:libgbm1" = "latest"
"apt:libxkbfile1" = "latest"
"apt:libxss1" = "latest"
"apt:libsecret-1-0" = "latest"    # VS Code keyring
"apt:libdbus-glib-1-2" = "latest" # Zen (Gecko)

# ── Dotfiles ────────────────────────────────────────────────────────────────
[dotfiles]
"~/.config/fish/config.fish" = { source = "fish/config.fish", mode = "symlink" }
"~/.config/starship.toml"    = { source = "starship.toml", mode = "symlink" }
# symlink-each: leaves mise's own binary in ~/.local/bin alone.
"~/.local/bin"                               = { source = "bin", mode = "symlink-each" }
"~/.config/autostart/mise-bootstrap.desktop" = { source = "xfce/mise-bootstrap.desktop.tmpl", mode = "template" }
"~/.config/xfce4/terminal/terminalrc"        = { source = "xfce/terminalrc", mode = "symlink" }
"~/.config/mimeapps.list"                    = { source = "xfce/mimeapps.list", mode = "symlink" }
# template: .desktop files don't expand `~`.
"~/.local/share/applications/code.desktop" = { source = "xfce/applications/code.desktop.tmpl", mode = "template" }
"~/.local/share/applications/zen.desktop"  = { source = "xfce/applications/zen.desktop.tmpl", mode = "template" }
# Held a token; replaced by bin/git-credential-fnox.
"~/.git-credentials" = { mode = "absent" }

# ── Repos ───────────────────────────────────────────────────────────────────
# neko only: on a Mac these checkouts hold real work. neko-bootstrap passes
# --skip-dirty, or one dirty repo would stop the desktop provisioning.
[bootstrap.repos]
"~/Repositories/dawarich-regression" = { url = "https://github.com/h-wb/dawarich-regression.git" }
"~/Repositories/codex"               = { url = "https://github.com/h-wb/codex.git" }
"~/Repositories/sync-anilist"        = { url = "https://github.com/h-wb/codex-plugins.git" }
"~/Repositories/sento"               = { url = "https://github.com/h-wb/sento.git" }
"~/Repositories/main-go-brrr"        = { url = "https://github.com/h-wb/main-go-brrr.git" }
"~/Repositories/dlt"                 = { url = "https://github.com/h-wb/pipelines.git" }
# Read-only references: partial clones keep the PVC small (first clone only).
"~/Repositories/dawarich"            = { url = "https://github.com/Freika/dawarich.git", filter = "blob:none" }
"~/Repositories/onedr0p"             = { url = "https://github.com/onedr0p/home-ops.git", filter = "blob:none" }
"~/Repositories/jory"                = { url = "https://github.com/joryirving/home-ops.git", filter = "blob:none" }
"~/Repositories/vrozaksen"           = { url = "https://github.com/vrozaksen/home-ops.git", filter = "blob:none" }

# ── Tasks ───────────────────────────────────────────────────────────────────
# The last step of `mise bootstrap`. /etc is image state, so the shell and
# timezone are re-applied after every pod roll.
[tasks.bootstrap]
run = [
  { task = "neko:shell" },
  { task = "neko:tz" },
  { task = "neko:fonts" },
  { task = "neko:gh" },
  { task = "neko:xfce" },
  { task = "anki:setup" },
  { task = "obsidian:start" },
]

[tasks."neko:shell"]
description = "Make fish the login shell (for kubectl exec)"
hide = true
skip_if = 'f="$(command -v fish)" || exit 0; [ "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$f" ]'
run = 'sudo chsh -s "$(command -v fish)" "$(id -un)"'

[tasks."neko:tz"]
description = "Link /etc/localtime to $TZ (the image is UTC)"
hide = true
skip_if = '[ ! -f "/usr/share/zoneinfo/$TZ" ] || [ "$(readlink /etc/localtime)" = "/usr/share/zoneinfo/$TZ" ]'
run = 'sudo ln -sf "/usr/share/zoneinfo/$TZ" /etc/localtime'

[tasks."neko:fonts"]
description = "MesloLGS NF for the starship prompt (on the PVC: a one-time download)"
hide = true
skip_if = 'for s in Regular Bold Italic "Bold Italic"; do [ -f "$HOME/.local/share/fonts/MesloLGS NF $s.ttf" ] || exit 1; done'
run = '''
dir="$HOME/.local/share/fonts"
mkdir -p "$dir"
for s in Regular Bold Italic "Bold Italic"; do
	f="$dir/MesloLGS NF $s.ttf"
	[ -f "$f" ] && continue
	curl -fsSL "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20$(echo "$s" | sed 's/ /%20/g').ttf" -o "$f" || rm -f "$f"
done
fc-cache -f "$dir" >/dev/null 2>&1 || true
'''

# Persists GH_TOKEN into ~/.config/gh for later terminals. Both `env -u` matter:
# with GH_TOKEN set, `gh auth status` always passes and `gh auth login` refuses.
[tasks."neko:gh"]
description = "Store GH_TOKEN in gh's own config"
hide = true
skip_if = '[ -z "${GH_TOKEN:-}" ] || ! command -v gh >/dev/null 2>&1 || env -u GH_TOKEN -u GITHUB_TOKEN gh auth status >/dev/null 2>&1'
run = 'printf %s "$GH_TOKEN" | env -u GH_TOKEN -u GITHUB_TOKEN gh auth login --with-token'

# xfconfd is a session daemon: this only works from the autostart run, not a
# bare `kubectl exec`, where it skips.
[tasks."neko:xfce"]
description = "Apply XFCE settings (xfconf) inside the neko desktop session"
skip_if = '! command -v xfconf-query >/dev/null 2>&1 || { [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && ! xfconf-query -l >/dev/null 2>&1; }'
run = "sh tasks/xfce.sh"

# ── Doctor checks ───────────────────────────────────────────────────────────
[doctor.checks.neko-hold]
description = "session-start provisioning is not parked"
hint = "rm ~/.neko-hold to resume, then run `neko-bootstrap`"
run = '''
[ -e "$HOME/.neko-hold" ] || exit 0
echo "~/.neko-hold is present: neko-bootstrap exits before doing anything"
exit 1
'''

[doctor.checks.neko-autostart]
description = "the autostart entry that reprovisions a rolled pod exists"
hint = "run `mise bootstrap --only dotfiles --force-dotfiles`"
run = '''
f="$HOME/.config/autostart/mise-bootstrap.desktop"
[ -f "$f" ] || { echo "missing $f — a rolled pod would come back unprovisioned"; exit 1; }
[ -x "$HOME/.local/bin/neko-bootstrap" ] || { echo "~/.local/bin/neko-bootstrap missing or not executable"; exit 1; }
'''
