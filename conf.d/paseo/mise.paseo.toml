# Paseo agent pods (home-ops agents/paseo).

[settings]
# Untrusted repo configs fail every shim run there.
trusted_config_paths = ["~/Repositories", "~/.paseo/worktrees"]

[env]
LANG = "C.UTF-8" # Debian ships C.UTF-8 without `locales`
PROTON_PASS_SESSION_DIR = "{{ env.HOME }}/.local/state/pass-cli/paseo-{{ get_env(name='PASEO_DATA_SCOPE', default='general') }}"
PROTON_PASS_AGENT_REASON = "paseo-{{ get_env(name='PASEO_DATA_SCOPE', default='general') }} fnox"
PROTON_PASS_KEY_PROVIDER = "fs" # seccomp blocks the kernel keyring

[tools]
"aqua:anomalyco/opencode" = "latest"
"npm:chrome-devtools-mcp" = "latest"
starship = "latest"
"github:protonpass/pass-cli" = "latest"
"github:jdx/fnox" = "latest"

[bootstrap.repos]
"~/Repositories/home-ops" = { url = "https://github.com/h-wb/home-ops.git" }
"~/Repositories/dawarich-regression" = { url = "https://github.com/h-wb/dawarich-regression.git" }
"~/Repositories/dotfiles" = { url = "https://github.com/h-wb/dotfiles.git" }
"~/Repositories/sento" = { url = "https://github.com/h-wb/sento.git" }
"~/Repositories/pipelines" = { url = "https://github.com/h-wb/pipelines.git" }

[dotfiles]
"~/.bashrc" = { source = "bashrc", mode = "symlink" }
"~/.config/starship.toml" = { source = "starship.toml", mode = "symlink" }
"~/.paseo/config.json/defaults" = { source = "defaults.json", merge = "missing" }

# Copies, not symlinks: Paseo propagates them into new worktrees.
"~/Repositories/pipelines/mise.local.toml" = { source = "projects/pipelines/mise.toml.tera", mode = "template", permissions = "600" }
"~/Repositories/sento/mise.local.toml" = { source = "projects/sento/mise.toml", mode = "copy", permissions = "600" }
"~/Repositories/sento/fnox.toml" = { source = "projects/sento/fnox.toml", mode = "copy", permissions = "600" }

# Removed 2026-11-08; drop these once both pods have applied them.
"~/.profile" = { mode = "absent" }
"~/.local/bin/pc" = { mode = "absent" }
"~/.local/bin/pls" = { mode = "absent" }
"~/.local/bin/patt" = { mode = "absent" }
"~/.local/bin/psend" = { mode = "absent" }
"~/.local/bin/pstop" = { mode = "absent" }
"~/.local/bin/mise" = { mode = "absent" } # the old copy; mise is /opt/mise now

[tasks.bootstrap]
run = [
  { task = "paseo:pass-login" },
]

[tasks."paseo:pass-login"]
extends = "proton-login"
description = "Authenticate this pod's scoped Proton Pass session"
hide = true
env.PROTON_PASS_LOGIN_SESSION = "paseo-{{ get_env(name='PASEO_DATA_SCOPE', default='general') }}"
