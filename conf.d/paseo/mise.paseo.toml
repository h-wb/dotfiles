# The paseo agent host: a headless pod in home-ops (kubernetes/apps/main/agents/paseo),
# image ghcr.io/getpaseo/paseo (Debian bookworm), user `paseo` (1000), no sudo, no
# systemd. Only /home/paseo is on a PVC. Detected by /etc/paseo, which the pod mounts.
#
# Layers: pod, not workstation (miserc.toml). Cloud models (Claude, Codex) run here:
# no personal data; fnox goes through the `paseo` Proton Pass access token
# (paseo:pass-login, below), which reads the Homelab, env-home-ops, env-dlt and
# env-dotfiles vaults. The token reaches the pod as PROTON_PASS_TOKEN from the
# Bitwarden `paseo` item (home-ops agents/paseo).
# Cluster access is the pod's service account, since no kubeconfig is rendered here.

[settings]
# Agents work in clones and Paseo worktrees that carry their own mise configs
# (home-ops' .mise.toml); an untrusted one fails every shim run in that directory.
trusted_config_paths = ["~/Repositories", "~/.paseo/worktrees"]

[env]
# Scoped Proton Pass session for this pod's fnox use; a repo's own config
# (home-ops' .mise.toml) overrides it with its separate session dir there.
PROTON_PASS_SESSION_DIR = "{{ env.HOME }}/.local/state/pass-cli/paseo"
PROTON_PASS_AGENT_REASON = "paseo fnox"
# seccomp blocks the kernel keyring pass-cli uses by default; `fs` keeps the key
# on the PVC (same as neko).
PROTON_PASS_KEY_PROVIDER = "fs"

[tools]
"aqua:anomalyco/opencode" = "latest"
flux2 = "latest"
helm = "latest"
kustomize = "latest"
jq = "latest"
yq = "latest"
starship = "latest"
"github:home-operations/flate" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"github:jpillora/sshd-lite" = "latest"   # the pod's sshd sidecar (home-ops agents/paseo)
"github:protonpass/pass-cli" = "latest"  # the `paseo` token's session (paseo:pass-login)
"github:jdx/fnox" = "latest"             # repos' fnox.toml ref their vaults

# Checkouts this host is provisioned from: cloned / fast-forwarded into
# ~/Repositories by `mise bootstrap` (paseo-bootstrap) at every pod start.
[bootstrap.repos]
"~/Repositories/home-ops"            = { url = "https://github.com/h-wb/home-ops.git" }
"~/Repositories/dawarich-regression" = { url = "https://github.com/h-wb/dawarich-regression.git" }
"~/Repositories/dotfiles"           = { url = "https://github.com/h-wb/dotfiles.git" }
"~/Repositories/sento"              = { url = "https://github.com/h-wb/sento.git" }
"~/Repositories/pipelines"          = { url = "https://github.com/h-wb/pipelines.git" }

# A pull can change a repo's mise config, which invalidates its content-hashed
# trust marker; without a fresh `mise trust`, every daemon-spawned helper there
# (git credential helper → gh shim, claude shim for workspace auto-naming) dies
# with "Config files ... are not trusted" and chats fail to start. Hooks run
# before the config-dependent parts, so trust the repos as soon as they exist.
[bootstrap.hooks.post-repos]
run = "mise bootstrap repos exec -- mise trust"

[dotfiles]
"~/.bashrc"                       = { source = "bashrc", mode = "symlink" }
"~/.profile"                      = { source = "profile", mode = "symlink" }
"~/.config/starship.toml"         = { source = "starship.toml", mode = "symlink" }
"~/.local/bin"                     = { source = "bin", mode = "symlink-each" }
"~/.config/opencode/opencode.json" = { source = "opencode.json", mode = "symlink" }
"~/.paseo/config.json/defaults"     = { source = "defaults.json", merge = "missing" }
"~/.paseo/config.json/providers"    = { source = "providers.json", merge = true }

[shell_alias]
# Paseo session shortcuts — daemon-managed, so visible on mobile/web/CLI.
# Use these instead of running claude/codex/vibe directly for anything you
# want to see on another device.
pc    = "paseo run --provider claude"
px    = "paseo run --provider codex"
pv    = "paseo run --provider mistral-vibe"
pls   = "paseo ls"
patt  = "paseo attach"
psend = "paseo send"
pstop = "paseo stop"

# ── Tasks ───────────────────────────────────────────────────────────────────
[tasks."paseo:latest"]
description = "Attach to the most recent Paseo session"
run = '''
id="$(paseo ls -q 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no sessions"
fi
'''

[tasks."paseo:latest-claude"]
description = "Attach to the most recent Claude session"
run = '''
id="$(paseo ls -q --provider claude 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no claude sessions"
fi
'''

[tasks."paseo:latest-codex"]
description = "Attach to the most recent Codex session"
run = '''
id="$(paseo ls -q --provider codex 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no codex sessions"
fi
'''

[tasks."paseo:latest-vibe"]
description = "Attach to the most recent Mistral Vibe session"
run = '''
id="$(paseo ls -q --provider mistral-vibe 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no vibe sessions"
fi
'''

[tasks.bootstrap]
run = [
  { task = "paseo:mcp" },
  { task = "paseo:pass-login" },
]

# The pod's Proton Pass session. The token (PROTON_PASS_TOKEN, from the
# Bitwarden `paseo` item via home-ops' ExternalSecret) opens the Homelab,
# env-home-ops, env-dlt and env-dotfiles vaults; repos' pass:login tasks log the
# same token into their own session dirs.
# Idempotent, and a no-op without the token so the bootstrap predates it fine.
[tasks."paseo:pass-login"]
description = "Log the pod's Proton Pass session in (the `paseo` access token)"
hide = true
run = '''
mkdir -p "${PROTON_PASS_SESSION_DIR}" && chmod 700 "${PROTON_PASS_SESSION_DIR}"
if [ -z "${PROTON_PASS_TOKEN:-}" ]; then
    echo "[pass-login] no PROTON_PASS_TOKEN in env; skipping"
    exit 0
fi
pass-cli info >/dev/null 2>&1 && { echo "already logged in"; exit 0; }
PROTON_PASS_PERSONAL_ACCESS_TOKEN="${PROTON_PASS_TOKEN}" pass-cli login
'''

# The pod's headless Chromium sidecar. OpenCode gets it from opencode.json.
[tasks."paseo:mcp"]
description = "Register the browser MCP with Claude Code, Codex and Vibe"
hide = true
run = '''
url=http://127.0.0.1:9222
# codex refuses to start when its home is missing, as on a fresh PVC.
mkdir -p "${CODEX_HOME:-$HOME/.codex}"
claude mcp get chrome-devtools >/dev/null 2>&1 ||
	claude mcp add -s user chrome-devtools -- chrome-devtools-mcp --browserUrl "$url"
codex mcp get chrome-devtools >/dev/null 2>&1 ||
	codex mcp add chrome-devtools -- chrome-devtools-mcp --browserUrl "$url"
# `vibe mcp add` is idempotent: a no-op when the server is already configured.
vibe mcp add chrome-devtools --transport stdio --command chrome-devtools-mcp --arg=--browserUrl --arg="$url"
'''

# ── Doctor checks ───────────────────────────────────────────────────────────
[doctor.checks.paseo-kube]
description = "kubectl reaches the cluster through the pod's service account"
hint = "KUBECONFIG must be unset (the workstation layer sets it); check the paseo ServiceAccount's bindings in home-ops"
run = '''
[ -z "${KUBECONFIG:-}" ] || { echo "KUBECONFIG is set ($KUBECONFIG)"; exit 1; }
kubectl auth can-i list pods --all-namespaces >/dev/null || { echo "service account cannot list pods"; exit 1; }
'''
