# The Paseo pods (README.md).

[settings]
# Untrusted repo configs fail every shim run there.
trusted_config_paths = ["~/Repositories", "~/.paseo/worktrees"]

# One Proton Pass session per data scope (home-ops sets PASEO_DATA_SCOPE): the
# session directory, the login task and the agent's stated reason share the name.
[vars]
pass_session = "paseo-{{ get_env(name='PASEO_DATA_SCOPE', default='general') }}"
# The general pod commits as the bot (static identity, no runtime lookup). The
# private pod shares this class but keeps the owner's identity, so the default
# is deliberately not "general".
git_name = "{% if get_env(name='PASEO_DATA_SCOPE', default='') == 'general' %}bot-tintin[bot]{% else %}h-wb{% endif %}"
git_email = "{% if get_env(name='PASEO_DATA_SCOPE', default='') == 'general' %}356770504+bot-tintin[bot]@users.noreply.github.com{% else %}{{ get_env(name='GIT_EMAIL', default='') }}{% endif %}"

[env]
LANG = "C.UTF-8" # Debian ships C.UTF-8 without `locales`
PROTON_PASS_SESSION_DIR = "{{ env.HOME }}/.local/state/pass-cli/{{ vars.pass_session }}"
PROTON_PASS_AGENT_REASON = "{{ vars.pass_session }} fnox"
PROTON_PASS_KEY_PROVIDER = "fs" # seccomp blocks the kernel keyring

[tools]
"npm:chrome-devtools-mcp" = "latest"
starship = "latest"

[bootstrap.repos]
"~/Repositories/home-ops" = { url = "https://github.com/h-wb/home-ops.git", ref = "main" }
"~/Repositories/dotfiles" = { url = "https://github.com/h-wb/dotfiles.git", ref = "master" }
"~/Repositories/handbook" = { url = "https://github.com/h-wb/handbook.git", ref = "main" }
"~/Repositories/miroir" = { url = "https://github.com/h-wb/miroir.git", ref = "main" }
"~/Repositories/sento" = { url = "https://github.com/h-wb/sento.git", ref = "main" }
"~/Repositories/skills" = { url = "https://github.com/h-wb/skills.git", ref = "main" }

[dotfiles]
"~/.bashrc" = { source = "bashrc", mode = "symlink" }
"~/.config/starship.toml" = { source = "starship.toml", mode = "symlink" }
"~/.claude/skills/*" = { source = "../../vendor/skills/groups/workshop/*", mode = "symlink" }
"~/.agents/skills/*" = { source = "../../vendor/skills/groups/workshop/*", mode = "symlink" }

[tasks.bootstrap]
run = [
  { task = "paseo:pass-login" },
]

[tasks."paseo:pass-login"]
extends = "proton-login"
description = "Authenticate this pod's scoped Proton Pass session"
hide = true
env.PROTON_PASS_LOGIN_SESSION = "{{ vars.pass_session }}"
