# The paseo agent host: a headless pod in home-ops (kubernetes/apps/main/agents/paseo),
# image ghcr.io/getpaseo/paseo (Debian bookworm), user `paseo` (1000), no sudo, no
# systemd. Only /home/paseo is on a PVC. Detected by /etc/paseo, which the pod mounts.
#
# Layers: pod, not workstation (miserc.toml). Cloud models (Claude, Codex) run here:
# never give this class personal data or anything from fnox. Cluster access is the
# pod's service account, since no kubeconfig is rendered here.

[settings]
# Agents work in clones and Paseo worktrees that carry their own mise configs
# (home-ops' .mise.toml); an untrusted one fails every shim run in that directory.
trusted_config_paths = ["~/Repositories", "~/.paseo/worktrees"]

[tools]
"aqua:anomalyco/opencode" = "latest"
flux2 = "latest"
helm = "latest"
kustomize = "latest"
jq = "latest"
yq = "latest"
starship = "latest"
"github:home-operations/flate" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"github:jpillora/sshd-lite" = "latest"   # the pod's sshd sidecar (home-ops agents/paseo)

[dotfiles]
"~/.bashrc"                       = { source = "bashrc", mode = "symlink" }
"~/.config/starship.toml"         = { source = "starship.toml", mode = "symlink" }
"~/.local/bin"                     = { source = "bin", mode = "symlink-each" }
"~/.config/opencode/opencode.json" = { source = "opencode.json", mode = "symlink" }
"~/.paseo/config.json/defaults"     = { source = "defaults.json", merge = "missing" }
"~/.paseo/config.json/providers"    = { source = "providers.json", merge = true }

[shell_alias]
# Paseo session shortcuts — daemon-managed, so visible on mobile/web/CLI.
# Use these instead of running claude/codex/vibe directly for anything you
# want to see on another device.
pc    = "paseo run --provider claude"
px    = "paseo run --provider codex"
pv    = "paseo run --provider mistral-vibe"
pls   = "paseo ls"
patt  = "paseo attach"
psend = "paseo send"
pstop = "paseo stop"

# ── Tasks ───────────────────────────────────────────────────────────────────
[tasks."paseo:latest"]
description = "Attach to the most recent Paseo session"
run = '''
id="$(paseo ls -q 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no sessions"
fi
'''

[tasks."paseo:latest-claude"]
description = "Attach to the most recent Claude session"
run = '''
id="$(paseo ls -q --provider claude 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no claude sessions"
fi
'''

[tasks."paseo:latest-codex"]
description = "Attach to the most recent Codex session"
run = '''
id="$(paseo ls -q --provider codex 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no codex sessions"
fi
'''

[tasks."paseo:latest-vibe"]
description = "Attach to the most recent Mistral Vibe session"
run = '''
id="$(paseo ls -q --provider mistral-vibe 2>/dev/null | head -1)"
if [ -n "$id" ]; then
    paseo attach "$id"
else
    echo "no vibe sessions"
fi
'''

[tasks.bootstrap]
run = [
  { task = "paseo:mcp" },
]

# The pod's headless Chromium sidecar. OpenCode gets it from opencode.json.
[tasks."paseo:mcp"]
description = "Register the browser MCP with Claude Code and Codex"
hide = true
run = '''
url=http://127.0.0.1:9222
# codex refuses to start when its home is missing, as on a fresh PVC.
mkdir -p "${CODEX_HOME:-$HOME/.codex}"
claude mcp get chrome-devtools >/dev/null 2>&1 ||
	claude mcp add -s user chrome-devtools -- chrome-devtools-mcp --browserUrl "$url"
codex mcp get chrome-devtools >/dev/null 2>&1 ||
	codex mcp add chrome-devtools -- chrome-devtools-mcp --browserUrl "$url"
'''

# ── Doctor checks ───────────────────────────────────────────────────────────
[doctor.checks.paseo-kube]
description = "kubectl reaches the cluster through the pod's service account"
hint = "KUBECONFIG must be unset (the workstation layer sets it); check the paseo ServiceAccount's bindings in home-ops"
run = '''
[ -z "${KUBECONFIG:-}" ] || { echo "KUBECONFIG is set ($KUBECONFIG)"; exit 1; }
kubectl auth can-i list pods --all-namespaces >/dev/null || { echo "service account cannot list pods"; exit 1; }
'''
