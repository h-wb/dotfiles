# Same layout as neko's fish prompt.

format = """$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold magenta"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
