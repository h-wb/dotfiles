# Private reference map for Sento; no secret values are stored here.
[providers.protonpass]
type = "proton-pass"
vault = "Agents General"
agent_reason = "sento fnox"

[secrets]
SENTO_QBITTORRENT_USERNAME = { provider = "protonpass", value = "pass://Agents General/qBittorrent/username" }
SENTO_QBITTORRENT_PASSWORD = { provider = "protonpass", value = "pass://Agents General/qBittorrent/password" }
SENTO_PROWLARR_API_KEY = { provider = "protonpass", value = "pass://Agents General/Prowlarr/api-key" }
# Repository-scoped GitHub token: grant explicitly with `mise x --secrets GH_TOKEN -- gh ...`.
GH_TOKEN = { provider = "protonpass", value = "pass://Agents General/github-sento/password" }
