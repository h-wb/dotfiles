# Proton Pass references only (no values), injected by `mise run apply`.

[providers.protonpass]
type = "proton-pass"
vault = "Machines"

[secrets]
SSH_TRUENAS_HOST = { provider = "protonpass", value = "pass://Machines/truenas-ssh/host" }
SSH_TRUENAS_USER = { provider = "protonpass", value = "pass://Machines/truenas-ssh/username" }
WG0_HOME_CONF = { provider = "protonpass", value = "pass://Machines/wireguard-home-split/note" }
# Internal addresses in a public repo; conf.d/macos-k8s-dns reads them as bootstrap secrets.
K8S_GATEWAY_IP_MAIN = { provider = "protonpass", value = "pass://Machines/kubernetes-gateway/ip address" }
K8S_GATEWAY_IP_EDGE = { provider = "protonpass", value = "pass://Machines/kubernetes-gateway/ip address edge" }

# The cluster's domain (home-ops' SECRET_DOMAIN), never committed: conf.d/ai
# renders the agents' gateway and memini URLs from it.
SECRET_DOMAIN = { provider = "protonpass", value = "pass://Machines/kubernetes-gateway/domain" }

# One kubeconfig per cluster, as custom fields on one item.
KUBECONFIG_MAIN = { provider = "protonpass", value = "pass://Machines/kubeconfig/main" }
KUBECONFIG_EDGE = { provider = "protonpass", value = "pass://Machines/kubeconfig/edge" }

# GH_TOKEN is only really needed in neko (the Macs' keychain covers git and gh).
GIT_EMAIL = { provider = "protonpass", value = "pass://Machines/github-workstation/email" }
GH_TOKEN = { provider = "protonpass", value = "pass://Machines/github-workstation/token" }

# AnkiConnect's apiKey (conf.d/neko-anki); n8n holds the same value.
ANKICONNECT_API_KEY = { provider = "protonpass", value = "pass://Machines/anki-connect/password" }
# AnkiMCP's bearer key (conf.d/neko-anki); ToolHive holds the same value (BWS `toolhive`).
ANKIMCP_API_KEY = { provider = "protonpass", value = "pass://Machines/anki-mcp/password" }

